<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>EL DORADO - Đăng nhập</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:Arial,Helvetica,sans-serif;

    color:white;

    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.75)
        ),
        url("nennhom.jpg")
        center/cover
        no-repeat fixed;
}

.login-box{

    width:100%;
    max-width:390px;

    padding:28px 24px;

    border-radius:22px;

    background:
        linear-gradient(
            160deg,
            rgba(13,22,36,0.96),
            rgba(5,10,18,0.96)
        );

    border:1px solid
        rgba(255,215,100,0.35);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.65);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo h1{

    font-size:39px;
    font-weight:900;

    letter-spacing:2px;

    color:#ffd65a;

    text-shadow:
        0 3px 0 #704500,
        0 0 20px rgba(255,210,70,0.55);
}

.logo p{

    margin-top:7px;
    color:#aeb7c5;
    font-size:13px;
}

.title{
    text-align:center;
    margin-bottom:21px;
}

.title h2{
    font-size:23px;
    margin-bottom:6px;
}

.title p{
    color:#8994a5;
    font-size:13px;
}

.message{

    display:none;

    padding:11px 12px;
    margin-bottom:15px;

    border-radius:10px;

    font-size:13px;

    text-align:center;
}

.message.show{
    display:block;
}

.message.error{

    color:#ffb3b3;

    background:rgba(255,70,70,0.10);

    border:1px solid
        rgba(255,70,70,0.25);
}

.message.success{

    color:#adf0b7;

    background:rgba(70,220,100,0.10);

    border:1px solid
        rgba(70,220,100,0.25);
}

.input-group{
    margin-bottom:16px;
}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:bold;

    color:#d4dae2;
}

.input-group input{

    width:100%;

    height:49px;

    padding:0 14px;

    border-radius:11px;

    border:1px solid
        rgba(255,255,255,0.12);

    outline:none;

    background:
        rgba(255,255,255,0.06);

    color:white;

    font-size:15px;
}

.input-group input::placeholder{
    color:#667184;
}

.input-group input:focus{

    border-color:#e2b23f;

    background:
        rgba(255,255,255,0.09);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:52px;
}

.password-button{

    position:absolute;

    right:5px;
    top:5px;

    width:39px;
    height:39px;

    border:none;
    background:transparent;

    color:#aab3c1;

    font-size:17px;

    cursor:pointer;
}

.remember{

    display:flex;
    align-items:center;

    gap:7px;

    margin:
        6px 0 18px;

    color:#9ea8b8;

    font-size:12px;
}

.remember input{
    accent-color:#e5b33e;
}

.login-button{

    width:100%;

    height:51px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #b77808,
            #ffd65b
        );

    color:#1e1507;

    font-size:16px;

    font-weight:900;

    cursor:pointer;
}

.footer{

    margin-top:20px;

    text-align:center;

    color:#5f6b7a;

    font-size:10px;
}

/* THÊM GIAO DIỆN NÚT LẬP NHÓM VÀ DRAW (TÀNG HÌNH) */
.nut-lap-nhom {
    position: absolute;
    bottom: 2%;
    left: 1%;
    width: 15%; 
    height: 20%;
    display: block;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
}

.nut-draw {
    position: absolute;
    bottom: 2%;
    right: 1%;
    width: 15%; 
    height: 20%;
    display: block;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
}

</style>

</head>

<body>

<!-- THÊM CHỨC NĂNG BẤM TÀNG HÌNH CHO 2 NÚT -->
<a href="lap-nhom.html" class="nut-lap-nhom"></a>
<a href="draw.html" class="nut-draw"></a>

<div class="login-box">

    <div class="logo">

        <h1>EL DORADO</h1>

        <p>
            Thế giới phiêu lưu đang chờ bạn
        </p>

    </div>

    <div class="title">

        <h2>Đăng nhập</h2>

        <p>
            Nhập tài khoản để bắt đầu
        </p>

    </div>

    <div
        id="message"
        class="message">
    </div>

    <div class="input-group">

        <label>Tài khoản</label>

        <input
            id="username"
            type="text"
            placeholder="Nhập tên tài khoản">

    </div>

    <div class="input-group">

        <label>Mật khẩu</label>

        <div class="password-box">

            <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu">

            <button
                type="button"
                class="password-button"
                onclick="togglePassword()">

                👁

            </button>

        </div>

    </div>

    <label class="remember">

        <input
            id="remember"
            type="checkbox">

        Ghi nhớ tài khoản

    </label>

    <button
        class="login-button"
        onclick="login()">

        ĐĂNG NHẬP

    </button>

    <div class="footer">
        EL DORADO © 2026
    </div>

</div>


<script>

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message show " + type;
}


function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".password-button");

    if(password.type === "password"){

        password.type = "text";
        button.textContent = "🙈";

    }else{

        password.type = "password";
        button.textContent = "👁";

    }
}


function login(){

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if(username === ""){

        showMessage(
            "Vui lòng nhập tài khoản.",
            "error"
        );

        return;
    }


    if(password === ""){

        showMessage(
            "Vui lòng nhập mật khẩu.",
            "error"
        );

        return;
    }


    /* Lưu tên người chơi */

    localStorage.setItem(
        "eldoradoPlayerName",
        username
    );


    localStorage.setItem(
        "eldoradoLoggedIn",
        "true"
    );


    showMessage(
        "Đăng nhập thành công! Đang vào game...",
        "success"
    );


    /*
       CHUYỂN THẲNG ĐẾN GITHUB PAGES (GIỮ NGUYÊN NHƯ CỦA BẠN)
    */

    setTimeout(function(){

        window.location.replace(
            "https://caosonphan2013-jpg.github.io/giaodien.html"
        );

    },500);

}

</script>

</body>
</html>
