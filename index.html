<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Dorado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #screen {
      position: fixed;
      top: 0; left: 0;
    }
    #bg {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    #overlay {
      position: absolute;
    }

    /* Vùng nút bấm trong suốt, đè lên ảnh */
    .btn-hit {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-hit:active {
      background: rgba(255, 210, 0, 0.25);
      box-shadow: 0 0 0 2px rgba(255, 210, 0, 0.5);
    }

    /* Popup khi bấm nút */
    #popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 99;
    }
    #popup.show { display: flex; }
    #popup-box {
      background: linear-gradient(160deg, #2a1500, #5c2d00);
      border: 2px solid #c8860a;
      border-radius: 16px;
      padding: 28px 36px;
      text-align: center;
      color: #ffd700;
      font-family: sans-serif;
      box-shadow: 0 0 30px rgba(200,134,10,0.4);
    }
    #popup-box h2 { font-size: 1.4rem; margin-bottom: 8px; }
    #popup-box p  { color: #ccc; font-size: 0.9rem; margin-bottom: 20px; }
    #popup-close {
      background: linear-gradient(135deg, #c8860a, #ffd700);
      color: #1a0a00;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

  <div id="overlay"></div>

<!-- Popup placeholder -->
<div id="popup">
  <div id="popup-box">
    <h2 id="popup-title">Lập nhóm</h2>
    <p id="popup-desc">Tính năng này đang được phát triển.</p>
    <button id="popup-close" onclick="closePopup()">Đóng</button>
  </div>
</div>

<script>
  // Kích thước ảnh gốc (sau khi nén)
  var IMG_W = 800, IMG_H = 450;

  // 6 nút: [tên, center_x%, center_y%, rộng%, cao%]
  var BTNS = [
    ['Lập nhóm',    5.4, 77, 7.5, 20],
    ['Nâng cấp',   12.6, 77, 7.5, 20],
    ['Draw',        19.9, 77, 7.5, 20],
    ['Shop',        27.2, 77, 7.5, 20],
    ['Thành tích',  34.5, 77, 7.5, 20],
    ['Bang hội',    41.8, 77, 7.5, 20],
  ];

  // Tạo nút một lần
  var overlay = document.getElementById('overlay');
  BTNS.forEach(function(b, i) {
    var btn = document.createElement('button');
    btn.className = 'btn-hit';
    btn.id = 'btn' + i;
    btn.addEventListener('click', function() { openPopup(b[0]); });
    overlay.appendChild(btn);
  });

  function layout() {
    var sw = window.innerWidth, sh = window.innerHeight;
    var screen = document.getElementById('screen');
    screen.style.width  = sw + 'px';
    screen.style.height = sh + 'px';

    // Tính vùng ảnh thực tế hiển thị (object-fit: contain)
    var imgRatio = IMG_W / IMG_H;
    var scRatio  = sw / sh;
    var rw, rh, rx, ry;
    if (imgRatio > scRatio) {
      rw = sw; rh = sw / imgRatio;
      rx = 0;  ry = (sh - rh) / 2;
    } else {
      rh = sh; rw = sh * imgRatio;
      rx = (sw - rw) / 2; ry = 0;
    }

    overlay.style.left   = rx + 'px';
    overlay.style.top    = ry + 'px';
    overlay.style.width  = rw + 'px';
    overlay.style.height = rh + 'px';

    // Đặt vị trí từng nút theo % của vùng ảnh
    BTNS.forEach(function(b, i) {
      var btn = document.getElementById('btn' + i);
      var cx = b[1], cy = b[2], bw = b[3], bh = b[4];
      btn.style.left   = ((cx - bw/2) / 100 * rw) + 'px';
      btn.style.top    = ((cy - bh/2) / 100 * rh) + 'px';
      btn.style.width  = (bw / 100 * rw) + 'px';
      btn.style.height = (bh / 100 * rh) + 'px';
    });
  }

  function openPopup(name) {
    document.getElementById('popup-title').textContent = name;
    document.getElementById('popup').classList.add('show');
  }
  function closePopup() {
    document.getElementById('popup').classList.remove('show');
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function() {
    setTimeout(layout, 300);
  });
</script>
