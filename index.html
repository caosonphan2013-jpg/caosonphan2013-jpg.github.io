<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Dorado</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      overflow: hidden;
    }

    .game-background {
      /* Ép trình duyệt điện thoại phải phủ ảnh kín 100% chiều cao và chiều ngang */
      height: 100vh;
      width: 100vw;
      background-image: url('nengame.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

  <!-- Ký tự &nbsp; (khoảng trắng tàng hình) giúp thẻ không bị trống hoàn toàn -->
  <div class="game-background">&nbsp;</div>

</body>
</html>
