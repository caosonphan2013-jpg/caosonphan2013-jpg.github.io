<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>EL DORADO</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #05070b;
    color: white;
}

/* =========================
   NỀN
========================= */

body {
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(2, 7, 15, 0.45),
            rgba(2, 7, 15, 0.72)
        ),
        url("nennhom.jpg") center center / cover no-repeat fixed;
}

/* =========================
   TRUNG TÂM
========================= */

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

/* =========================
   LOGO
========================= */

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo h1 {
    font-size: 42px;
    font-weight: 900;

    color: #ffd65a;

    text-shadow:
        0 3px 0 #7a4d00,
        0 0 18px rgba(255, 205, 70, 0.45);

    letter-spacing: 2px;
}

.logo p {
    margin-top: 5px;

    font-size: 13px;
    color: #c6ccd7;
}

/* =========================
   BOX
========================= */

.card {
    width: min(92vw, 390px);

    padding: 25px;

    border-radius: 22px;

    background:
        linear-gradient(
            160deg,
            rgba(18, 25, 38, 0.96),
            rgba(7, 11, 18, 0.96)
        );

    border: 1px solid rgba(255, 214, 90, 0.30);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.05);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* =========================
   TAB
========================= */

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 6px;

    padding: 5px;

    background: rgba(255,255,255,0.05);

    border-radius: 13px;

    margin-bottom: 20px;
}

.tab {
    border: none;

    padding: 12px 8px;

    border-radius: 9px;

    background: transparent;

    color: #8993a4;

    font-weight: 800;

    cursor: pointer;
}

.tab.active {
    background:
        linear-gradient(
            135deg,
            #a97008,
            #ffd85b
        );

    color: #17120a;
}

/* =========================
   FORM
========================= */

.form {
    display: none;
}

.form.active {
    display: block;
}

.form h2 {
    margin-bottom: 7px;

    font-size: 23px;
}

.form-desc {
    color: #8e99aa;

    font-size: 13px;

    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 14px;
}

.input-group label {
    display: block;

    margin-bottom: 7px;

    color: #cbd2dc;

    font-size: 13px;

    font-weight: bold;
}

.input-group input {
    width: 100%;

    padding: 13px 14px;

    border-radius: 11px;

    border: 1px solid rgba(255,255,255,0.10);

    outline: none;

    background: rgba(255,255,255,0.06);

    color: white;

    font-size: 15px;

    transition: 0.2s;
}

.input-group input:focus {
    border-color: #e2af37;

    background: rgba(255,255,255,0.09);

    box-shadow:
        0 0 0 3px rgba(226,175,55,0.10);
}

.input-group input::placeholder {
    color: #687283;
}

/* =========================
   PASSWORD
========================= */

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 50px;
}

.eye {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 38px;
    height: 38px;

    border: none;
    background: transparent;

    color: #aab3c1;

    font-size: 17px;

    cursor: pointer;
}

/* =========================
   OPTIONS
========================= */

.options {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin: 5px 0 17px;

    font-size: 12px;
}

.remember {
    display: flex;
    align-items: center;

    gap: 7px;

    color: #a9b1bf;
}

.remember input {
    accent-color: #e6b743;
}

.forgot {
    color: #e7bb4a;

    border: none;

    background: none;

    cursor: pointer;
}

/* =========================
   BUTTON
========================= */

.main-btn {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #b57a0b,
            #ffd65a
        );

    color: #17120a;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(214,166,45,0.20);

    transition: 0.2s;
}

.main-btn:active {
    transform: scale(0.98);
}

/* =========================
   ĐĂNG NHẬP NHANH
========================= */

.divider {
    display: flex;

    align-items: center;

    gap: 10px;

    color: #667182;

    font-size: 11px;

    margin: 19px 0;
}

.divider::before,
.divider::after {
    content: "";

    flex: 1;

    height: 1px;

    background: rgba(255,255,255,0.08);
}

.quick-btn {
    width: 100%;

    padding: 11px;

    border-radius: 11px;

    border: 1px solid rgba(255,255,255,0.10);

    background: rgba(255,255,255,0.04);

    color: white;

    cursor: pointer;
}

.quick-btn:active {
    background: rgba(255,255,255,0.08);
}

/* =========================
   THÔNG BÁO
========================= */

.message {
    display: none;

    padding: 10px 12px;

    margin-bottom: 14px;

    border-radius: 10px;

    font-size: 12px;

    line-height: 1.4;
}

.message.error {
    display: block;

    color: #ffb0b0;

    border: 1px solid rgba(255,80,80,0.25);

    background: rgba(255,80,80,0.10);
}

.message.success {
    display: block;

    color: #abefb5;

    border: 1px solid rgba(90,220,110,0.25);

    background: rgba(90,220,110,0.10);
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    margin-top: 16px;

    color: #687384;

    font-size: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 450px) {

    .card {
        padding: 20px;
    }

    .logo h1 {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div>

        <!-- LOGO -->
        <div class="logo">
            <h1>EL DORADO</h1>
            <p>Thế giới phiêu lưu bắt đầu từ đây</p>
        </div>

        <div class="card">

            <!-- TAB -->
            <div class="tabs">

                <button
                    class="tab active"
                    id="loginTab"
                    onclick="showForm('login')">
                    Đăng nhập
                </button>

                <button
                    class="tab"
                    id="registerTab"
                    onclick="showForm('register')">
                    Đăng ký
                </button>

            </div>

            <!-- THÔNG BÁO -->
            <div
                id="message"
                class="message">
            </div>

            <!-- =====================
                 ĐĂNG NHẬP
            ====================== -->

            <div
                id="loginForm"
                class="form active">

                <h2>Chào mừng trở lại!</h2>

                <p class="form-desc">
                    Đăng nhập để tiếp tục cuộc phiêu lưu.
                </p>

                <div class="input-group">

                    <label>
                        Tài khoản
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Nhập tên tài khoản"
                        autocomplete="username">

                </div>

                <div class="input-group">

                    <label>
                        Mật khẩu
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password">

                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('loginPassword', this)">
                            👁
                        </button>

                    </div>

                </div>

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        Ghi nhớ

                    </label>

                    <button
                        class="forgot"
                        onclick="forgotPassword()">
                        Quên mật khẩu?
                    </button>

                </div>

                <button
                    class="main-btn"
                    onclick="login()">
                    ĐĂNG NHẬP
                </button>

                <div class="divider">
                    HOẶC
                </div>

                <button
                    class="quick-btn"
                    onclick="guestLogin()">
                    🎮 Chơi thử
                </button>

            </div>

            <!-- =====================
                 ĐĂNG KÝ
            ====================== -->

            <div
                id="registerForm"
                class="form">

                <h2>Tạo tài khoản</h2>

                <p class="form-desc">
                    Tạo tài khoản để bắt đầu hành trình.
                </p>

                <div class="input-group">

                    <label>
                        Tên tài khoản
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="3-16 ký tự">

                </div>

                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="example@email.com">

                </div>

                <div class="input-group">

                    <label>
                        Mật khẩu
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Ít nhất 6 ký tự">

                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('registerPassword', this)">
                            👁
                        </button>

                    </div>

                </div>

                <div class="input-group">

                    <label>
                        Nhập lại mật khẩu
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="registerConfirm"
                            placeholder="Nhập lại mật khẩu">

                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('registerConfirm', this)">
                            👁
                        </button>

                    </div>

                </div>

                <button
                    class="main-btn"
                    onclick="register()">
                    TẠO TÀI KHOẢN
                </button>

            </div>

        </div>

        <div class="footer">
            © 2026 EL DORADO · Fantasy Adventure
        </div>

    </div>

</div>

<script>

/* =========================
   CHUYỂN ĐĂNG NHẬP / ĐĂNG KÝ
========================= */

function showForm(type) {

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    clearMessage();

    if (type === "login") {

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

    } else {

        registerForm.classList.add("active");
        loginForm.classList.remove("active");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

    }
}


/* =========================
   THÔNG BÁO
========================= */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;
}

function clearMessage() {

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className =
        "message";
}


/* =========================
   ẨN / HIỆN MẬT KHẨU
========================= */

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

    } else {

        input.type = "password";
        button.textContent = "👁";

    }
}


/* =========================
   ĐĂNG KÝ DEMO
========================= */

function register() {

    const username =
        document
        .getElementById("registerUsername")
        .value
        .trim();

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const confirm =
        document
        .getElementById("registerConfirm")
        .value;


    if (username.length < 3) {

        showMessage(
            "Tên tài khoản phải có ít nhất 3 ký tự.",
            "error"
        );

        return;
    }

    if (username.length > 16) {

        showMessage(
            "Tên tài khoản tối đa 16 ký tự.",
            "error"
        );

        return;
    }

    if (!email.includes("@")) {

        showMessage(
            "Email chưa hợp lệ.",
            "error"
        );

        return;
    }

    if (password.length < 6) {

        showMessage(
            "Mật khẩu phải có ít nhất 6 ký tự.",
            "error"
        );

        return;
    }

    if (password !== confirm) {

        showMessage(
            "Hai mật khẩu không giống nhau.",
            "error"
        );

        return;
    }


    /*
       PHẦN NÀY CHỈ LÀ DEMO.

       Lưu tạm tài khoản trên điện thoại
       bằng localStorage.
    */

    const user = {

        username: username,
        email: email,
        password: password

    };


    localStorage.setItem(
        "eldoradoUser",
        JSON.stringify(user)
    );


    showMessage(
        "Đăng ký thành công! Đang chuyển sang đăng nhập...",
        "success"
    );


    setTimeout(function() {

        document.getElementById(
            "loginUsername"
        ).value = username;

        document.getElementById(
            "loginPassword"
        ).value = "";

        showForm("login");

    }, 1000);
}


/* =========================
   ĐĂNG NHẬP DEMO
========================= */

function login() {

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    const saved =
        localStorage.getItem("eldoradoUser");


    if (!saved) {

        showMessage(
            "Bạn chưa có tài khoản. Hãy đăng ký trước.",
            "error"
        );

        return;
    }


    const user =
        JSON.parse(saved);


    if (
        username !== user.username ||
        password !== user.password
    ) {

        showMessage(
            "Sai tài khoản hoặc mật khẩu.",
            "error"
        );

        return;
    }


    showMessage(
        "Đăng nhập thành công! 🎉",
        "success"
    );


    /*
       Hiện tại chưa chuyển sang game.

       Khi làm game.html, chúng ta sẽ đổi
       dòng này thành:

       window.location.href = "game.html";
    */

    setTimeout(function() {

        alert(
            "Đăng nhập thành công!\n\nBước tiếp theo sẽ là màn hình CHỌN NHÂN VẬT."
        );

    }, 500);
}


/* =========================
   CHƠI THỬ
========================= */

function guestLogin() {

    alert(
        "Chế độ chơi thử đã được chọn.\n\n" +
        "Bước tiếp theo sẽ vào màn hình chọn nhân vật."
    );
}


/* =========================
   QUÊN MẬT KHẨU
========================= */

function forgotPassword() {

    alert(
        "Chức năng đặt lại mật khẩu sẽ được kết nối với hệ thống tài khoản sau."
    );
}

</script>

</body>
</html>
