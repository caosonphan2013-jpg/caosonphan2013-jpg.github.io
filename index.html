<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>El Dorado</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    #overlay {
      position: absolute;
      pointer-events: none;
    }

    .btn-hit {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-hit:active {
      background: rgba(255, 210, 0, 0.25);
      box-shadow: 0 0 0 2px rgba(255, 210, 0, 0.5);
    }

    /* POPUP */
    #popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    #popup.show {
      display: flex;
    }

    #popup-box {
      width: min(90vw, 420px);
      background: linear-gradient(160deg, #2a1500, #5c2d00);
      border: 2px solid #c8860a;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      color: #ffd700;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 30px rgba(200, 134, 10, 0.4);
    }

    #popup-box h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    #popup-box p {
      color: #ccc;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    #popup-close {
      background: linear-gradient(135deg, #c8860a, #ffd700);
      color: #1a0a00;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Nếu ảnh lỗi */
    #image-error {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    #image-error.show {
      display: flex;
    }

    #image-error div {
      max-width: 450px;
    }

    #image-error b {
      color: #ffd700;
    }
  </style>
</head>

<body>

<div id="screen">

  <!-- ẢNH NỀN TRONG REPOSITORY -->
  <img
    id="bg"
    src="./nennhom.jpg"
    alt="El Dorado"
  >

  <div id="overlay"></div>

</div>

<!-- POPUP -->
<div id="popup">
  <div id="popup-box">

    <h2 id="popup-title">Lập nhóm</h2>

    <p id="popup-desc">
      Tính năng này đang được phát triển.
    </p>

    <button id="popup-close" onclick="closePopup()">
      Đóng
    </button>

  </div>
</div>

<!-- LỖI ẢNH -->
<div id="image-error">
  <div>
    <h2>❌ Không tải được ảnh</h2>

    <p>
      Không tìm thấy:
      <br><br>
      <b>nennhom.jpg</b>
      <br><br>
      Hãy kiểm tra file ảnh trong GitHub.
    </p>
  </div>
</div>

<script>

  const bg = document.getElementById("bg");
  const overlay = document.getElementById("overlay");

  /* Ảnh phải cùng thư mục với file HTML */
  const buttons = [

    ["Lập nhóm", 5.4, 77, 7.5, 20],

    ["Nâng cấp", 12.6, 77, 7.5, 20],

    ["Draw", 19.9, 77, 7.5, 20],

    ["Shop", 27.2, 77, 7.5, 20],

    ["Thành tích", 34.5, 77, 7.5, 20],

    ["Bang hội", 41.8, 77, 7.5, 20]

  ];

  const btnElements = [];

  /* TẠO NÚT */
  buttons.forEach(function(data, index) {

    const btn = document.createElement("button");

    btn.className = "btn-hit";

    btn.id = "btn" + index;

    btn.setAttribute("aria-label", data[0]);

    btn.addEventListener("click", function() {

      openPopup(data[0]);

    });

    overlay.appendChild(btn);

    btnElements.push(btn);

  });


  /* CĂN ẢNH + NÚT */
  function layout() {

    const sw = window.innerWidth;
    const sh = window.innerHeight;

    const imgW = bg.naturalWidth || 800;
    const imgH = bg.naturalHeight || 450;

    const imgRatio = imgW / imgH;
    const screenRatio = sw / sh;

    let rw;
    let rh;
    let rx;
    let ry;

    /* object-fit: contain */
    if (imgRatio > screenRatio) {

      rw = sw;
      rh = sw / imgRatio;

      rx = 0;
      ry = (sh - rh) / 2;

    } else {

      rh = sh;
      rw = sh * imgRatio;

      rx = (sw - rw) / 2;
      ry = 0;

    }

    overlay.style.left = rx + "px";
    overlay.style.top = ry + "px";

    overlay.style.width = rw + "px";
    overlay.style.height = rh + "px";


    /* Đặt từng nút */
    buttons.forEach(function(data, index) {

      const btn = btnElements[index];

      const cx = data[1];
      const cy = data[2];

      const bw = data[3];
      const bh = data[4];


      btn.style.left =
        ((cx - bw / 2) / 100 * rw) + "px";

      btn.style.top =
        ((cy - bh / 2) / 100 * rh) + "px";

      btn.style.width =
        (bw / 100 * rw) + "px";

      btn.style.height =
        (bh / 100 * rh) + "px";

    });

  }


  /* MỞ POPUP */
  function openPopup(name) {

    document.getElementById("popup-title").textContent = name;

    document.getElementById("popup-desc").textContent =
      "Bạn vừa bấm vào " + name + ".";

    document.getElementById("popup").classList.add("show");

  }


  /* ĐÓNG POPUP */
  function closePopup() {

    document.getElementById("popup").classList.remove("show");

  }


  /* Bấm ra ngoài popup để đóng */
  document.getElementById("popup").addEventListener("click", function(e) {

    if (e.target === this) {
      closePopup();
    }

  });


  /* ẢNH TẢI XONG */
  bg.addEventListener("load", function() {

    layout();

  });


  /* ẢNH LỖI */
  bg.addEventListener("error", function() {

    document.getElementById("image-error")
      .classList.add("show");

  });


  window.addEventListener("resize", layout);

  window.addEventListener("orientationchange", function() {

    setTimeout(layout, 300);

  });


  /* Nếu ảnh đã cache */
  if (bg.complete) {

    if (bg.naturalWidth > 0) {

      layout();

    }

  }

</script>

</body>
</html>
