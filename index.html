  <title>El Dorado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    
    #bg {
      width: 100%; height: 100%;
      object-fit: cover; /* Đổi thành cover để ảnh tràn viền mượt như game thật */
      display: block;
    }

    /* Vùng nút bấm tàng hình đè lên ảnh */
    .nut-tang-hinh {
      position: absolute;
      bottom: 2%; /* Sát mép dưới */
      left: 1%;   /* Sát mép trái */
      width: 15%; 
      height: 20%;
      display: block;
      z-index: 10;
      -webkit-tap-highlight-color: transparent; /* Tắt nháy xanh khi bấm trên điện thoại */
      
      /* Xóa dấu // ở dòng dưới nếu muốn hiện khung đỏ để căn chỉnh nút */
      /* border: 2px solid red; */
    }
  </style>
</head>
