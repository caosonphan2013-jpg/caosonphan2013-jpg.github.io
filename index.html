<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>EL DORADO - Đăng nhập</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:Arial,sans-serif;

    color:white;

    background:
        linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.75)
        ),
        url("nennhom.jpg")
        center/cover
        no-repeat fixed;
}


/* =========================
   KHUNG ĐĂNG NHẬP
========================= */

.login-box{

    width:100%;
    max-width:390px;

    padding:28px 24px;

    border-radius:22px;

    background:
        rgba(8,13,22,.90);

    border:1px solid
        rgba(255,215,100,.30);

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.60);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}


/* =========================
   LOGO
========================= */

.logo{

    text-align:center;

    margin-bottom:28px;
}

.logo h1{

    font-size:38px;

    font-weight:900;

    letter-spacing:2px;

    color:#ffd75a;

    text-shadow:
        0 3px 0 #734600,
        0 0 18px
        rgba(255,210,70,.45);
}

.logo p{

    margin-top:8px;

    font-size:13px;

    color:#aab2bf;
}


/* =========================
   TIÊU ĐỀ
========================= */

.title{

    text-align:center;

    margin-bottom:22px;
}

.title h2{

    font-size:23px;

    margin-bottom:6px;
}

.title p{

    color:#8993a3;

    font-size:13px;
}


/* =========================
   INPUT
========================= */

.input-group{

    margin-bottom:17px;
}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:bold;

    color:#d2d8e0;
}

.input-group input{

    width:100%;

    height:48px;

    padding:0 14px;

    border-radius:11px;

    border:1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color:white;

    outline:none;

    font-size:15px;

    transition:.2s;
}

.input-group input::placeholder{

    color:#697486;
}

.input-group input:focus{

    border-color:#e2b13e;

    background:
        rgba(255,255,255,.09);

    box-shadow:
        0 0 0 3px
        rgba(226,177,62,.10);
}


/* =========================
   PASSWORD
========================= */

.password{

    position:relative;
}

.password input{

    padding-right:50px;
}

.eye{

    position:absolute;

    right:5px;
    top:5px;

    width:38px;
    height:38px;

    border:0;

    background:transparent;

    color:#aab2bf;

    cursor:pointer;

    font-size:17px;
}


/* =========================
   ĐĂNG NHẬP
========================= */

.login-btn{

    width:100%;

    height:50px;

    margin-top:5px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #b67908,
            #ffd75c
        );

    color:#181107;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(220,170,45,.25);

    transition:.15s;
}

.login-btn:active{

    transform:scale(.98);
}


/* =========================
   THÔNG BÁO
========================= */

.message{

    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:10px;

    text-align:center;

    font-size:13px;
}

.message.show{

    display:block;
}

.message.error{

    color:#ffb0b0;

    background:
        rgba(255,70,70,.10);

    border:1px solid
        rgba(255,70,70,.25);
}

.message.success{

    color:#a9efb4;

    background:
        rgba(70,220,100,.10);

    border:1px solid
        rgba(70,220,100,.25);
}


/* =========================
   GHI NHỚ
========================= */

.remember{

    display:flex;

    align-items:center;

    gap:7px;

    margin:
        13px 0
        18px;

    color:#9da6b5;

    font-size:12px;
}

.remember input{

    accent-color:#e5b33e;
}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:20px;

    text-align:center;

    color:#5f6a79;

    font-size:10px;
}

</style>
</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <h1>EL DORADO</h1>

        <p>
            Thế giới phiêu lưu đang chờ bạn
        </p>

    </div>


    <!-- TIÊU ĐỀ -->

    <div class="title">

        <h2>Đăng nhập</h2>

        <p>
            Đăng nhập để tiếp tục
        </p>

    </div>


    <!-- THÔNG BÁO -->

    <div
        id="message"
        class="message">
    </div>


    <!-- TÀI KHOẢN -->

    <div class="input-group">

        <label>
            Tài khoản
        </label>

        <input
            id="username"
            type="text"
            placeholder="Nhập tên tài khoản"
            autocomplete="username">

    </div>


    <!-- MẬT KHẨU -->

    <div class="input-group">

        <label>
            Mật khẩu
        </label>

        <div class="password">

            <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password">

            <button
                class="eye"
                type="button"
                onclick="showPassword()">

                👁

            </button>

        </div>

    </div>


    <!-- GHI NHỚ -->

    <label class="remember">

        <input
            id="remember"
            type="checkbox">

        Ghi nhớ tài khoản

    </label>


    <!-- NÚT -->

    <button
        class="login-btn"
        onclick="login()">

        ĐĂNG NHẬP

    </button>


    <div class="footer">

        EL DORADO © 2026

    </div>


</div>



<script>

/* =========================
   HIỆN MẬT KHẨU
========================= */

function showPassword(){

    const password =
        document.getElementById(
            "password"
        );

    const button =
        document.querySelector(
            ".eye"
        );


    if(
        password.type ===
        "password"
    ){

        password.type =
            "text";

        button.textContent =
            "🙈";

    }else{

        password.type =
            "password";

        button.textContent =
            "👁";

    }

}


/* =========================
   THÔNG BÁO
========================= */

function message(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.className =
        "message show " +
        type;

}


/* =========================
   ĐĂNG NHẬP
========================= */

function login(){

    const username =
        document.getElementById(
            "username"
        )
        .value
        .trim();

    const password =
        document.getElementById(
            "password"
        )
        .value;


    if(!username){

        message(
            "Vui lòng nhập tài khoản.",
            "error"
        );

        return;
    }


    if(!password){

        message(
            "Vui lòng nhập mật khẩu.",
            "error"
        );

        return;
    }


    /*
       HIỆN TẠI CHỈ LÀ
       GIAO DIỆN ĐĂNG NHẬP.

       Chưa kết nối database.
    */


    message(
        "Đăng nhập thành công!",
        "success"
    );

}

</script>

</body>
</html>
