<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lập nhóm</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("nennhom.jpg") center/cover fixed no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .box {
            background: rgba(20, 20, 25, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 28px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Ảnh nhóm */

        .avatar-area {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }

        .avatar {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;

            border: 4px solid rgba(255, 255, 255, 0.8);

            background: #292929;

            cursor: pointer;

            transition: 0.25s;
        }

        .avatar:hover {
            transform: scale(1.05);
            border-color: #6c8cff;
        }

        #avatarInput {
            display: none;
        }

        .avatar-text {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        /* Input */

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            outline: none;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            border-radius: 12px;
            padding: 14px;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #7187ff;
            background: rgba(255, 255, 255, 0.11);
            box-shadow: 0 0 0 3px rgba(113, 135, 255, 0.12);
        }

        input::placeholder,
        textarea::placeholder {
            color: #888;
        }

        textarea {
            height: 95px;
            resize: none;
        }

        .counter {
            text-align: right;
            color: #777;
            font-size: 11px;
            margin-top: 5px;
        }

        /* Chế độ nhóm */

        .mode-title {
            margin-bottom: 10px;
        }

        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mode {
            position: relative;
        }

        .mode input {
            display: none;
        }

        .mode label {
            cursor: pointer;
            text-align: center;
            padding: 13px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            transition: 0.2s;
        }

        .mode input:checked + label {
            background: rgba(100, 120, 255, 0.22);
            border-color: #7187ff;
            color: white;
        }

        /* Nút */

        .create-btn {
            width: 100%;
            margin-top: 8px;

            border: none;
            border-radius: 13px;

            padding: 15px;

            color: white;
            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #596cff,
                #8b5cff
            );

            box-shadow: 0 8px 25px rgba(89, 108, 255, 0.3);

            transition: 0.2s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(89, 108, 255, 0.45);
        }

        .create-btn:active {
            transform: scale(0.98);
        }

        /* Trang nhóm sau khi tạo */

        .group-page {
            display: none;
            text-align: center;
        }

        .group-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 15px;
        }

        .group-name {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .group-description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .info {
            background: rgba(255,255,255,0.06);
            padding: 14px;
            border-radius: 13px;
            margin-bottom: 15px;
            text-align: left;
        }

        .info div {
            padding: 5px 0;
            color: #ccc;
            font-size: 14px;
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.07);
            color: white;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        /* Thông báo */

        .message {
            display: none;
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid rgba(255, 70, 70, 0.35);
            color: #ff9b9b;
            padding: 11px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        /* Mobile */

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .box {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- FORM LẬP NHÓM -->
    <!-- ========================= -->

    <div class="box" id="createPage">

        <h1 class="title">Tạo nhóm</h1>

        <p class="subtitle">
            Tạo nhóm của bạn và bắt đầu kết nối
        </p>

        <!-- Avatar -->

        <div class="avatar-area">
            <img
                id="avatarPreview"
                class="avatar"
                src="nennhom.jpg"
                alt="Ảnh nhóm"
                onclick="document.getElementById('avatarInput').click()"
            >
        </div>

        <p class="avatar-text">
            Nhấn vào ảnh để chọn ảnh nhóm
        </p>

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
        >

        <!-- Thông báo -->

        <div
            class="message"
            id="message"
        ></div>

        <!-- Tên nhóm -->

        <div class="form-group">

            <label for="groupName">
                Tên nhóm
            </label>

            <input
                type="text"
                id="groupName"
                maxlength="30"
                placeholder="Nhập tên nhóm..."
            >

            <div class="counter">
                <span id="nameCount">0</span>/30
            </div>

        </div>

        <!-- Mô tả -->

        <div class="form-group">

            <label for="description">
                Mô tả nhóm
            </label>

            <textarea
                id="description"
                maxlength="150"
                placeholder="Nhập mô tả nhóm..."
            ></textarea>

            <div class="counter">
                <span id="descCount">0</span>/150
            </div>

        </div>

        <!-- Chế độ -->

        <div class="form-group">

            <label class="mode-title">
                Chế độ nhóm
            </label>

            <div class="modes">

                <div class="mode">

                    <input
                        type="radio"
                        name="mode"
                        id="public"
                        value="Công khai"
                        checked
                    >

                    <label for="public">
                        🌎 Công khai
                    </label>

                </div>

                <div class="mode">

                    <input
                        type="radio"
                        name="mode"
                        id="private"
                        value="Riêng tư"
                    >

                    <label for="private">
                        🔒 Riêng tư
                    </label>

                </div>

            </div>

        </div>

        <!-- Button -->

        <button
            class="create-btn"
            onclick="createGroup()"
        >
            ✨ TẠO NHÓM
        </button>

    </div>


    <!-- ========================= -->
    <!-- TRANG NHÓM -->
    <!-- ========================= -->

    <div
        class="box group-page"
        id="groupPage"
    >

        <img
            id="groupAvatar"
            class="group-avatar"
            src="nennhom.jpg"
            alt="Avatar nhóm"
        >

        <h1
            class="group-name"
            id="resultName"
        >
            Tên nhóm
        </h1>

        <p
            class="group-description"
            id="resultDescription"
        >
            Mô tả nhóm
        </p>

        <div class="info">

            <div>
                👑 Chủ nhóm:
                <b>Bạn</b>
            </div>

            <div>
                👥 Thành viên:
                <b>1</b>
            </div>

            <div>
                🌎 Chế độ:
                <b id="resultMode">
                    Công khai
                </b>
            </div>

            <div>
                🟢 Trạng thái:
                <b>Đang hoạt động</b>
            </div>

        </div>

        <button
            class="back-btn"
            onclick="backToCreate()"
        >
            ← Tạo nhóm khác
        </button>

    </div>

</div>


<script>

    /* =========================
       CHỌN ẢNH NHÓM
    ========================= */

    const avatarInput =
        document.getElementById("avatarInput");

    const avatarPreview =
        document.getElementById("avatarPreview");

    const groupAvatar =
        document.getElementById("groupAvatar");


    avatarInput.addEventListener(
        "change",
        function () {

            const file = this.files[0];

            if (!file) return;

            if (!file.type.startsWith("image/")) {

                showMessage(
                    "Vui lòng chọn một file ảnh!"
                );

                return;
            }

            const reader =
                new FileReader();

            reader.onload = function (event) {

                avatarPreview.src =
                    event.target.result;

                groupAvatar.src =
                    event.target.result;

            };

            reader.readAsDataURL(file);
        }
    );


    /* =========================
       ĐẾM KÝ TỰ
    ========================= */

    const groupName =
        document.getElementById("groupName");

    const description =
        document.getElementById("description");

    const nameCount =
        document.getElementById("nameCount");

    const descCount =
        document.getElementById("descCount");


    groupName.addEventListener(
        "input",
        function () {

            nameCount.textContent =
                this.value.length;

        }
    );


    description.addEventListener(
        "input",
        function () {

            descCount.textContent =
                this.value.length;

        }
    );


    /* =========================
       HIỆN THÔNG BÁO
    ========================= */

    function showMessage(text) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.style.display = "block";

    }


    /* =========================
       TẠO NHÓM
    ========================= */

    function createGroup() {

        const name =
            groupName.value.trim();

        const desc =
            description.value.trim();

        const mode =
            document.querySelector(
                'input[name="mode"]:checked'
            ).value;


        /* Kiểm tra tên */

        if (name.length < 2) {

            showMessage(
                "Tên nhóm phải có ít nhất 2 ký tự!"
            );

            groupName.focus();

            return;
        }


        /* Ẩn thông báo */

        document.getElementById(
            "message"
        ).style.display = "none";


        /* Hiển thị dữ liệu */

        document.getElementById(
            "resultName"
        ).textContent = name;


        document.getElementById(
            "resultDescription"
        ).textContent =
            desc || "Chưa có mô tả";


        document.getElementById(
            "resultMode"
        ).textContent = mode;


        /* Chuyển trang */

        document.getElementById(
            "createPage"
        ).style.display = "none";


        document.getElementById(
            "groupPage"
        ).style.display = "block";

    }


    /* =========================
       QUAY LẠI
    ========================= */

    function backToCreate() {

        document.getElementById(
            "groupPage"
        ).style.display = "none";


        document.getElementById(
            "createPage"
        ).style.display = "block";

    }

</script>

</body>
</html>
