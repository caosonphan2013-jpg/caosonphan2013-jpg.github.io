<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>EL DORADO - Đăng nhập</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,Helvetica,sans-serif;

    background:#050505 url("./nennhom.jpg")
    center center / cover no-repeat fixed;

    color:white;
}

.login-box{
    width:min(400px,92vw);
    padding:28px 24px;

    background:rgba(8,13,22,.94);

    border:2px solid rgba(255,214,90,.35);
    border-radius:20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        0 0 30px rgba(220,175,50,.12);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.logo{
    text-align:center;
    margin-bottom:27px;
}

.logo h1{
    color:#ffd65a;
    font-size:39px;
    font-weight:900;
    letter-spacing:3px;

    text-shadow:
        0 3px 0 #6e4500,
        0 0 18px rgba(255,210,70,.45);
}

.logo p{
    margin-top:7px;
    color:#adb6c4;
    font-size:13px;
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h2{
    font-size:23px;
    margin-bottom:6px;
}

.title p{
    color:#8d98a8;
    font-size:13px;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    color:#d6dce5;
    font-size:13px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    height:50px;

    padding:0 14px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;

    outline:none;

    background:rgba(255,255,255,.06);
    color:white;

    font-size:15px;
}

.input-group input::placeholder{
    color:#667182;
}

.input-group input:focus{
    border-color:#e2b33e;
    background:rgba(255,255,255,.09);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.eye{
    position:absolute;
    right:5px;
    top:5px;

    width:40px;
    height:40px;

    border:0;
    background:transparent;

    color:#adb6c2;
    font-size:17px;

    cursor:pointer;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;

    margin:6px 0 18px;

    color:#9da7b6;
    font-size:12px;
}

.remember input{
    accent-color:#e6b43f;
}

.login-btn{
    width:100%;
    height:51px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #b87809,
            #ffd65a
        );

    color:#1d1506;

    font-size:16px;
    font-weight:900;

    cursor:pointer;
}

.login-btn:active{
    transform:scale(.98);
}

.message{
    display:none;

    margin-bottom:14px;
    padding:10px 12px;

    border-radius:10px;

    text-align:center;
    font-size:13px;
}

.message.show{
    display:block;
}

.message.error{
    color:#ffb4b4;
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,70,70,.24);
}

.message.success{
    color:#b0efb8;
    background:rgba(70,220,100,.10);
    border:1px solid rgba(70,220,100,.24);
}

.footer{
    margin-top:18px;
    text-align:center;
    color:#5c6776;
    font-size:10px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>EL DORADO</h1>
        <p>Thế giới phiêu lưu đang chờ bạn</p>
    </div>

    <div class="title">
        <h2>Đăng nhập</h2>
        <p>Nhập thông tin để bắt đầu</p>
    </div>

    <div id="message" class="message"></div>

    <div class="input-group">
        <label>Tài khoản</label>

        <input
            id="username"
            type="text"
            placeholder="Nhập tên người chơi"
            autocomplete="username">
    </div>

    <div class="input-group">
        <label>Mật khẩu</label>

        <div class="password-box">
            <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password">

            <button
                class="eye"
                type="button"
                onclick="togglePassword()">
                👁
            </button>
        </div>
    </div>

    <label class="remember">
        <input id="remember" type="checkbox">
        Ghi nhớ tài khoản
    </label>

    <button
        class="login-btn"
        type="button"
        onclick="login()">
        ĐĂNG NHẬP
    </button>

    <div class="footer">
        EL DORADO © 2026
    </div>

</div>

<script>
function showMessage(text, type){
    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message show " + type;
}

function togglePassword(){
    const input = document.getElementById("password");
    const button = document.querySelector(".eye");

    if(input.type === "password"){
        input.type = "text";
        button.textContent = "🙈";
    }else{
        input.type = "password";
        button.textContent = "👁";
    }
}

function login(){

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    if(username === ""){
        showMessage(
            "Vui lòng nhập tài khoản.",
            "error"
        );
        return;
    }

    if(password === ""){
        showMessage(
            "Vui lòng nhập mật khẩu.",
            "error"
        );
        return;
    }

    localStorage.setItem(
        "eldoradoPlayerName",
        username
    );

    localStorage.setItem(
        "eldoradoLoggedIn",
        "true"
    );

    if(
        document.getElementById("remember").checked
    ){
        localStorage.setItem(
            "eldoradoRememberedName",
            username
        );
    }

    showMessage(
        "Đăng nhập thành công! Đang vào game...",
        "success"
    );

    setTimeout(function(){
        window.location.href = "./giaodien.html";
    }, 500);
}

document
    .getElementById("password")
    .addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            login();
        }
    });

window.addEventListener("load", function(){

    const saved =
        localStorage.getItem(
            "eldoradoRememberedName"
        );

    if(saved){

        document.getElementById(
            "username"
        ).value = saved;

        document.getElementById(
            "remember"
        ).checked = true;
    }
});
</script>

</body>
</html>
