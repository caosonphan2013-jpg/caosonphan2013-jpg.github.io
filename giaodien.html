<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>EL DORADO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

/* ===================================
   GAME
=================================== */

#game{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

/* ===================================
   KHUNG 16:9
=================================== */

#world{
    position:absolute;

    width:1536px;
    height:864px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}

/* ===================================
   ẢNH GỐC
=================================== */

#gameImage{
    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    user-select:none;
    -webkit-user-drag:none;

    pointer-events:none;
}

/* ===================================
   HITBOX
=================================== */

#buttons{
    position:absolute;
    left:0;
    top:0;

    width:1536px;
    height:864px;

    pointer-events:none;
}

.hit{
    position:absolute;

    border:0;
    background:transparent;

    pointer-events:auto;

    cursor:pointer;

    outline:none;

    touch-action:manipulation;
}

.hit:active{
    background:rgba(255,215,80,.15);

    box-shadow:
        inset 0 0 0 2px
        rgba(255,215,80,.45);
}

/* ===================================
   PROFILE
=================================== */

.profile{
    left:18px;
    top:18px;
    width:360px;
    height:92px;
}

/* ===================================
   RESOURCE
=================================== */

.resource1{
    left:505px;
    top:12px;
    width:190px;
    height:62px;
}

.resource2{
    left:705px;
    top:12px;
    width:190px;
    height:62px;
}

.resource3{
    left:905px;
    top:12px;
    width:190px;
    height:62px;
}

.resource4{
    left:1105px;
    top:12px;
    width:175px;
    height:62px;
}

/* ===================================
   TOP RIGHT
=================================== */

.mail{
    right:170px;
    top:7px;
    width:63px;
    height:63px;
}

.menu{
    right:100px;
    top:7px;
    width:63px;
    height:63px;
}

.settings{
    right:30px;
    top:7px;
    width:63px;
    height:63px;
}

/* ===================================
   EVENT
=================================== */

.monthly{
    right:30px;
    top:104px;
    width:305px;
    height:140px;
}

.special{
    right:25px;
    top:270px;
    width:130px;
    height:165px;
}

/* ===================================
   BOTTOM
=================================== */

.lapnhom{
    left:25px;
    bottom:8px;
    width:125px;
    height:120px;
}

.nangcap{
    left:165px;
    bottom:8px;
    width:125px;
    height:120px;
}

.draw{
    left:305px;
    bottom:8px;
    width:125px;
    height:120px;
}

.shop{
    left:445px;
    bottom:8px;
    width:125px;
    height:120px;
}

.thanhtich{
    left:585px;
    bottom:8px;
    width:135px;
    height:120px;
}

.banghoi{
    left:735px;
    bottom:8px;
    width:130px;
    height:120px;
}

.game-start{
    right:0;
    bottom:0;

    width:385px;
    height:145px;

    border-radius:40px 0 0 0;
}

/* ===================================
   THÔNG BÁO
=================================== */

#message{
    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(360px,85vw);

    padding:20px;

    background:rgba(8,12,18,.97);

    border:
        2px solid
        #d7ab39;

    border-radius:15px;

    color:white;

    text-align:center;

    z-index:9999;

    display:none;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.65);
}

#message.show{
    display:block;
}

#messageText{
    white-space:pre-line;
    line-height:1.5;
}

#message button{
    margin-top:15px;

    padding:10px 28px;

    border:0;
    border-radius:9px;

    background:
        linear-gradient(
            #f6cc55,
            #b37a0c
        );

    font-weight:bold;
    color:#181104;
}

/* ===================================
   ERROR ẢNH
=================================== */

#imageError{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:#120000;

    color:white;

    text-align:center;

    padding:30px;

    z-index:10000;
}

#imageError.show{
    display:flex;
}

#imageError strong{
    color:#ff6868;
}

/* ===================================
   MOBILE / TV
=================================== */

@media(max-width:1536px){

    #world{
        transform:
            translate(-50%,-50%)
            scale(
                min(
                    calc(100vw / 1536),
                    calc(100vh / 864)
                )
            );
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world">

        <!-- ẢNH GIAO DIỆN -->
        <img
            id="gameImage"
            src="./nengame.png"
            alt="EL DORADO">

        <!-- HITBOX -->
        <div id="buttons">

            <button
                class="hit profile"
                onclick="showProfile()">
            </button>

            <button
                class="hit resource1"
                onclick="showInfo('Tài nguyên: 0')">
            </button>

            <button
                class="hit resource2"
                onclick="showInfo('Vàng: 700,000')">
            </button>

            <button
                class="hit resource3"
                onclick="showInfo('Ngọc: 665')">
            </button>

            <button
                class="hit resource4"
                onclick="showInfo('B.P: 0')">
            </button>

            <button
                class="hit mail"
                onclick="showInfo('Hộp thư')">
            </button>

            <button
                class="hit menu"
                onclick="showInfo('Menu')">
            </button>

            <button
                class="hit settings"
                onclick="showInfo('Cài đặt')">
            </button>

            <button
                class="hit monthly"
                onclick="showInfo('Monthly Character')">
            </button>

            <button
                class="hit special"
                onclick="showInfo('Special Event')">
            </button>

            <!-- LẬP NHÓM -->
            <button
                class="hit lapnhom"
                onclick="openLapNhom()">
            </button>

            <button
                class="hit nangcap"
                onclick="showInfo('Nâng cấp')">
            </button>

            <button
                class="hit draw"
                onclick="showInfo('Draw')">
            </button>

            <button
                class="hit shop"
                onclick="showInfo('Shop')">
            </button>

            <button
                class="hit thanhtich"
                onclick="showInfo('Thành tích')">
            </button>

            <button
                class="hit banghoi"
                onclick="showInfo('Bang hội')">
            </button>

            <button
                class="hit game-start"
                onclick="showInfo('GAME START')">
            </button>

        </div>
    </div>
</div>

<!-- THÔNG BÁO -->

<div id="message">

    <div id="messageText"></div>

    <button onclick="closeMessage()">
        ĐÓNG
    </button>

</div>

<!-- LỖI ẢNH -->

<div id="imageError">

    <div>

        <h2>
            ❌ Không tải được giao diện
        </h2>

        <p style="margin-top:10px">
            Không tìm thấy file:
        </p>

        <strong>
            nengame.png
        </strong>

        <p style="margin-top:10px">
            Hãy kiểm tra file này có nằm
            cùng thư mục với giaodien.html hay không.
        </p>

    </div>

</div>

<script>

/* ===================================
   SCALE
=================================== */

function resizeGame(){

    const world =
        document.getElementById("world");

    const sw =
        window.innerWidth;

    const sh =
        window.innerHeight;

    const scale =
        Math.min(
            sw / 1536,
            sh / 864
        );

    world.style.transform =
        "translate(-50%,-50%) scale(" +
        scale +
        ")";

}

window.addEventListener(
    "resize",
    resizeGame
);

window.addEventListener(
    "orientationchange",
    function(){
        setTimeout(
            resizeGame,
            200
        );
    }
);

resizeGame();


/* ===================================
   ẢNH LỖI
=================================== */

document
    .getElementById("gameImage")
    .addEventListener(
        "error",
        function(){

            document
                .getElementById("imageError")
                .classList
                .add("show");

        }
    );


/* ===================================
   LẬP NHÓM
=================================== */

function openLapNhom(){

    window.location.href =
        "./lap-nhom.html";

}


/* ===================================
   PROFILE
=================================== */

function showProfile(){

    const name =
        localStorage.getItem(
            "eldoradoPlayerName"
        ) || "Người chơi";

    showInfo(
        "NHÂN VẬT\n\nTên: " + name
    );
}


/* ===================================
   INFO
=================================== */

function showInfo(text){

    document
        .getElementById("messageText")
        .textContent = text;

    document
        .getElementById("message")
        .classList
        .add("show");

}


function closeMessage(){

    document
        .getElementById("message")
        .classList
        .remove("show");

}

</script>

</body>
</html>
