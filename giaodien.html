<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giao Diện Chính - El Dorado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    
    #bg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* VÙNG BẤM TÀNG HÌNH: LẬP NHÓM (Icon số 1) */
    .nut-lap-nhom {
      position: absolute;
      bottom: 2%;
      left: 2%;
      width: 8%; 
      height: 16%;
      display: block;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      
      /* Xóa 2 dấu gạch chéo ở dòng dưới nếu muốn hiện viền đỏ để căn chỉnh */
      /* border: 2px solid red; background: rgba(255,0,0,0.3); */
    }

    /* VÙNG BẤM TÀNG HÌNH: DRAW (Icon số 3) */
    .nut-draw {
      position: absolute;
      bottom: 2%;
      left: 18.5%; 
      width: 8%; 
      height: 16%;
      display: block;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;

      /* Xóa 2 dấu gạch chéo ở dòng dưới nếu muốn hiện viền đỏ để căn chỉnh */
      /* border: 2px solid red; background: rgba(255,0,0,0.3); */
    }
  </style>
</head>
<body>

<div id="screen">
  <!-- Dùng đúng tên ảnh bạn vừa gửi -->
  <img id="bg" src="nengame_2.png">

  <!-- Nút bấm sang trang Lập Nhóm -->
  <a href="lap-nhom.html" class="nut-lap-nhom"></a>

  <!-- Nút bấm sang trang Rút Nhân Vật (Draw) -->
  <a href="draw.html" class="nut-draw"></a>
</div>

</body>
</html>
