<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giao Diện Chính - El Dorado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #screen {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    
    #bg {
      width: 100%; 
      height: 100%;
      /* Đã bỏ lệnh object-fit để ảnh và nút luôn khớp tỷ lệ với nhau */
      display: block;
    }

    /* VÙNG BẤM: LẬP NHÓM (Icon số 1) */
    .nut-lap-nhom {
      position: absolute;
      bottom: 2%; /* Căn từ dưới lên */
      left: 2%;   /* Căn từ trái sang */
      width: 9%;  /* Độ rộng của nút */
      height: 18%; /* Chiều cao của nút */
      display: block;
      z-index: 9999;
      -webkit-tap-highlight-color: transparent;
      
      /* Đang bật màu đỏ để bạn dễ nhìn. Khi nào khớp rồi thì xóa 2 dòng dưới đi */
      background: rgba(255, 0, 0, 0.5); 
      border: 2px solid yellow;
    }

    /* VÙNG BẤM: DRAW (Icon số 3) */
    .nut-draw {
      position: absolute;
      bottom: 2%;   /* Căn từ dưới lên */
      left: 19.5%;  /* Căn từ trái sang */
      width: 9%;    /* Độ rộng của nút */
      height: 18%;  /* Chiều cao của nút */
      display: block;
      z-index: 9999;
      -webkit-tap-highlight-color: transparent;

      /* Đang bật màu đỏ để bạn dễ nhìn. Khi nào khớp rồi thì xóa 2 dòng dưới đi */
      background: rgba(255, 0, 0, 0.5);
      border: 2px solid yellow;
    }
  </style>
</head>
<body>

<div id="screen">
  <img id="bg" src="nengame_2.png">

  <!-- Nút bấm sang trang Lập Nhóm -->
  <a href="lap-nhom.html" class="nut-lap-nhom"></a>

  <!-- Nút bấm sang trang Rút Nhân Vật (Draw) -->
  <a href="draw.html" class="nut-draw"></a>
</div>

</body>
</html>
