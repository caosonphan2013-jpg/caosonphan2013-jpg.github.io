<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Dorado - Giao Diện Chính</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Vùng bấm: Lập Nhóm (Icon 1) */
    .btn-lap-nhom {
      position: absolute;
      bottom: 2%;
      left: 1.5%;
      width: 8.5%;
      height: 16%;
      z-index: 99;
      -webkit-tap-highlight-color: transparent;
    }

    /* Vùng bấm: Draw (Icon 3) */
    .btn-draw {
      position: absolute;
      bottom: 2%;
      left: 18.5%;
      width: 8.5%;
      height: 16%;
      z-index: 99;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Đã chỉnh chuẩn đuôi .jpg -->
  <img class="bg-img" src="nengame.jpg" alt="Giao diện game">

  <a href="lap-nhom.html" class="btn-lap-nhom"></a>
  <a href="draw.html" class="btn-draw"></a>
</div>

</body>
</html>
