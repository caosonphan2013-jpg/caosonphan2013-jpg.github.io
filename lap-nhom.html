<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Lập nhóm - EL DORADO</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   GAME
===================================================== */

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#000;
}


/* =====================================================
   NỀN
===================================================== */

#background{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:translate(-50%,-50%);

    user-select:none;
    -webkit-user-drag:none;
}


/* lớp tối nhẹ */

.overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.10),
            rgba(0,0,0,.20)
        );

    pointer-events:none;
}


/* =====================================================
   THANH TRÊN
===================================================== */

.topbar{
    position:absolute;

    top:10px;
    left:18px;
    right:18px;

    height:72px;

    display:flex;
    align-items:center;

    z-index:20;
}


/* nút trở về */

.back-btn{
    width:58px;
    height:58px;

    border-radius:16px;

    border:2px solid rgba(255,255,255,.8);

    background:
        rgba(0,0,0,.38);

    color:white;

    font-size:33px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 4px 14px rgba(0,0,0,.25);
}


/* tiêu đề */

.title{
    margin-left:12px;

    color:white;

    font-size:40px;

    font-weight:400;

    text-shadow:
        0 2px 5px rgba(0,0,0,.65);
}


/* tài nguyên */

.resources{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:9px;
}


/* từng tài nguyên */

.resource{
    min-width:135px;
    height:40px;

    border-radius:22px;

    display:flex;
    align-items:center;

    padding:0 12px;

    background:
        linear-gradient(
            rgba(0,0,0,.65),
            rgba(0,0,0,.45)
        );

    border:1px solid
        rgba(255,255,255,.28);

    color:white;

    font-size:18px;
}

.resource .icon{
    width:30px;
    margin-right:5px;

    font-size:22px;
}

.resource .value{
    flex:1;
    text-align:center;

    font-weight:600;
}


/* số nhân vật */

.character-count{
    position:absolute;

    right:5px;
    top:83px;

    color:white;

    font-size:18px;

    text-shadow:
        0 2px 4px black;
}


/* =====================================================
   Ô NHÂN VẬT
===================================================== */

.character-row{
    position:absolute;

    left:50%;
    top:200px;

    transform:translateX(-50%);

    width:min(1000px,72vw);

    height:155px;

    display:flex;
    gap:18px;

    z-index:10;
}


/* slot */

.slot{
    position:relative;

    width:170px;
    height:120px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            rgba(24,83,111,.82),
            rgba(38,76,99,.72)
        );

    border:
        2px solid
        rgba(255,255,255,.10);

    box-shadow:
        inset 0 0 30px rgba(255,255,255,.05),
        0 6px 14px rgba(0,0,0,.15);
}


/* slot đang chọn */

.slot.active{
    background:
        linear-gradient(
            145deg,
            #c37d20,
            #8c4f16
        );

    border:
        3px solid #ffd66b;

    box-shadow:
        0 0 16px
        rgba(255,220,110,.42);
}


/* dấu cộng */

.plus{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:56px;

    font-weight:200;

    color:#ffd46b;

    text-shadow:
        0 2px 5px rgba(0,0,0,.25);
}


/* nhân vật trong slot */

.slot-character{
    position:absolute;

    inset:7px 7px 24px 7px;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}


/* ảnh nhỏ */

.slot-character img{
    max-width:100%;
    max-height:100%;

    object-fit:contain;

    filter:drop-shadow(
        0 5px 6px
        rgba(0,0,0,.35)
    );
}


/* giá */

.slot-cost{
    position:absolute;

    left:50%;
    bottom:3px;

    transform:
        translateX(-50%);

    color:white;

    font-size:17px;

    text-shadow:
        0 2px 4px black;
}


/* =====================================================
   CARD NHÂN VẬT
===================================================== */

.card{
    position:absolute;

    left:50%;
    top:375px;

    transform:
        translateX(-50%);

    width:250px;

    min-height:335px;

    padding:8px;

    border-radius:10px;

    background:
        linear-gradient(
            180deg,
            #f5d989,
            #b77c2d
        );

    border:
        4px solid #f1c75e;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.38);

    z-index:15;
}


/* phần trong */

.card-inner{
    position:relative;

    min-height:315px;

    padding:
        38px 12px 12px;

    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #f5dca1,
            #e1b866
        );

    color:#603b18;

    overflow:hidden;
}


/* nhãn Act */

.act{
    position:absolute;

    left:-10px;
    top:-4px;

    width:64px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#d95718;

    color:white;

    font-size:16px;

    font-weight:500;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 82%,
            50% 100%,
            0 82%
        );
}


/* sao */

.star{
    position:absolute;

    top:8px;
    left:50%;

    transform:
        translateX(-50%);

    color:#ffe46f;

    font-size:23px;

    text-shadow:
        0 1px 2px #754500;
}


/* tên */

.char-name{

    text-align:center;

    margin-top:1px;

    font-size:23px;

    color:#67350f;

    font-weight:500;
}


/* ảnh nhân vật */

.main-character{
    width:145px;
    height:145px;

    display:block;

    margin:0 auto;

    object-fit:contain;

    filter:drop-shadow(
        0 6px 5px
        rgba(0,0,0,.22)
    );
}


/* thông tin */

.info{
    margin-top:2px;

    font-size:16px;
}


.info-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:4px 0;

    border-top:
        1px solid
        rgba(100,50,0,.15);
}


.info-row:first-child{
    border-top:none;
}


.blue{
    color:#365e99;
    font-weight:bold;
}


/* =====================================================
   MENU KHI CHẠM NHÂN VẬT
===================================================== */

#characterMenu{
    position:absolute;

    display:none;

    z-index:100;

    width:150px;

    background:
        linear-gradient(
            180deg,
            #f6f6f6,
            #d9e0e8
        );

    border:
        3px solid #8b8b8b;

    border-radius:9px;

    overflow:hidden;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.45);
}


#characterMenu.show{
    display:block;
}


/* mũi nhọn */

#characterMenu::before{
    content:"";

    position:absolute;

    left:-14px;
    top:90px;

    border-top:12px solid transparent;
    border-bottom:12px solid transparent;

    border-right:
        14px solid #8b8b8b;
}


/* từng nút */

.menu-item{

    width:100%;

    min-height:52px;

    border:none;

    border-bottom:
        1px solid #c4ccd4;

    background:#e7edf3;

    color:#222;

    font-size:18px;

    text-align:center;

    cursor:pointer;

    padding:7px 4px;
}


.menu-item:last-child{
    border-bottom:none;
}


.menu-item:active{
    background:#cfd8e2;
}


/* Rút */

.menu-item.withdraw{
    background:#ffb000;
    color:white;
}


/* =====================================================
   DƯỚI MÀN HÌNH
===================================================== */

.bottom{
    position:absolute;

    left:20px;
    right:20px;
    bottom:12px;

    height:82px;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:20;
}


/* nút sao */

.star-nav{
    position:absolute;

    bottom:0;

    width:100px;
    height:74px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.34);

    background:
        rgba(0,0,0,.18);

    color:white;

    font-size:14px;

    cursor:pointer;

    text-align:center;
}


.star-left1{left:3px;}
.star-left2{left:120px;}
.star-left3{left:237px;}
.star-left4{left:354px;}


.star-right1{right:354px;}
.star-right2{right:237px;}
.star-right3{right:120px;}
.star-right4{right:3px;}


.star-nav span{
    display:block;
}


/* Draw */

.draw{
    width:170px;
    height:62px;

    margin-right:24px;

    border-radius:15px;

    border:
        3px solid #bc7cff;

    background:
        linear-gradient(
            180deg,
            #823ff0,
            #6a26ce
        );

    color:white;

    font-size:23px;

    font-weight:bold;

    text-shadow:
        0 2px 3px rgba(0,0,0,.5);

    cursor:pointer;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.28);
}


/* bắt đầu trò chơi */

.start{
    width:190px;
    height:62px;

    border-radius:15px;

    border:
        3px solid #d9c17b;

    background:
        linear-gradient(
            180deg,
            #78c4f5,
            #2f71c1
        );

    color:white;

    font-size:21px;

    font-weight:bold;

    line-height:23px;

    cursor:pointer;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.28);

    text-shadow:
        0 2px 3px rgba(0,0,0,.5);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .topbar{
        left:8px;
        right:8px;
    }

    .title{
        font-size:28px;
    }

    .resource{
        min-width:85px;
        font-size:12px;
    }

    .resource .icon{
        font-size:16px;
    }

    .character-row{
        transform:
            translateX(-50%)
            scale(.78);

        transform-origin:
            top center;
    }

    .card{
        transform:
            translateX(-50%)
            scale(.82);

        transform-origin:
            top center;
    }

    .star-nav{
        transform:scale(.78);
    }

    .draw,
    .start{
        transform:scale(.78);
    }

}


@media(max-width:600px){

    .resources{
        display:none;
    }

    .character-count{
        font-size:13px;
        top:74px;
    }

    .back-btn{
        width:48px;
        height:48px;
        font-size:28px;
    }

    .title{
        font-size:23px;
    }

    .character-row{
        top:140px;

        transform:
            translateX(-50%)
            scale(.52);
    }

    .card{
        top:300px;

        transform:
            translateX(-50%)
            scale(.65);
    }

    .bottom{
        bottom:6px;
    }

    .star-nav{
        display:none;
    }

    .draw{
        width:130px;
        margin-right:8px;
        transform:scale(.78);
    }

    .start{
        width:150px;
        transform:scale(.78);
    }

}

</style>
</head>


<body>

<div id="game">


    <!-- =================================================
         NỀN
    ================================================== -->

    <img
        id="background"
        src="nennhom.jpg"
        alt="Nền lập nhóm">


    <div class="overlay"></div>


    <!-- =================================================
         THANH TRÊN
    ================================================== -->

    <div class="topbar">

        <button
            class="back-btn"
            onclick="goBack()">
            ‹
        </button>


        <div class="title">
            Lập nhóm
        </div>


        <div class="resources">

            <div class="resource">
                <div class="icon">🐣</div>
                <div class="value">0</div>
            </div>

            <div class="resource">
                <div class="icon">🟣</div>
                <div class="value">0</div>
            </div>

            <div class="resource">
                <div class="icon">🪙</div>
                <div class="value">700,000</div>
            </div>

            <div class="resource">
                <div class="icon">♦️</div>
                <div class="value">665</div>
            </div>

            <div class="resource">
                <div class="icon">B.P</div>
                <div class="value">0</div>
            </div>

        </div>


        <div class="character-count">
            My Characters : 1/30
        </div>

    </div>


    <!-- =================================================
         SLOTS
    ================================================== -->

    <div class="character-row">


        <!-- NHÂN VẬT -->

        <div class="slot active">

            <div class="slot-character">

                <img
                    src="hengame.png"
                    alt="Ace">

            </div>

            <div class="slot-cost">
                💧 30
            </div>

        </div>


        <!-- Ô TRỐNG -->

        <div class="slot">
            <div class="plus">+</div>
        </div>


        <div class="slot">
            <div class="plus">+</div>
        </div>


        <div class="slot">
            <div class="plus">+</div>
        </div>


        <div class="slot">
            <div class="plus">+</div>
        </div>


    </div>


    <!-- =================================================
         CARD NHÂN VẬT
    ================================================== -->

    <div
        class="card"
        id="characterCard"
        onclick="toggleCharacterMenu(event)">


        <div class="card-inner">


            <div class="act">
                Act.
            </div>


            <div class="star">
                ★
            </div>


            <div class="char-name">
                Ace
            </div>


            <img
                class="main-character"
                src="hengame.png"
                alt="Ace">


            <div class="info">


                <div class="info-row">

                    <span>
                        Lv.1/20
                    </span>

                    <span>
                        0%
                    </span>

                </div>


                <div class="info-row">

                    <span>
                        💧 30
                    </span>

                    <span>
                        Kiểu tấn công
                    </span>

                </div>


                <div class="info-row">

                    <span>
                        AP
                    </span>

                    <span>
                        2
                    </span>

                </div>


                <div class="info-row">

                    <span>
                        HP
                    </span>

                    <span>
                        10
                    </span>

                </div>


            </div>

        </div>

    </div>


    <!-- =================================================
         MENU
    ================================================== -->

    <div
        id="characterMenu">


        <button
            class="menu-item withdraw"
            onclick="menuAction(event,'Rút')">
            Rút
        </button>


        <button
            class="menu-item"
            onclick="menuAction(event,'Bán')">
            Bán
        </button>


        <button
            class="menu-item"
            onclick="menuAction(event,'Nâng cấp độ')">
            Nâng cấp độ
        </button>


        <button
            class="menu-item"
            onclick="menuAction(event,'Item')">
            Item
        </button>


        <button
            class="menu-item"
            onclick="menuAction(event,'Lock')">
            Lock
        </button>


        <button
            class="menu-item"
            onclick="closeCharacterMenu(event)">
            Đóng
        </button>


    </div>


    <!-- =================================================
         BOTTOM
    ================================================== -->

    <div class="bottom">


        <button
            class="star-nav star-left1">
            Moving<br>1 star
        </button>


        <button
            class="star-nav star-left2">
            Moving<br>2 star
        </button>


        <button
            class="star-nav star-left3">
            Moving<br>3 star
        </button>


        <button
            class="star-nav star-left4">
            Moving<br>4 star
        </button>


        <button
            class="draw"
            onclick="draw()">
            🎴 Draw
        </button>


        <button
            class="start"
            onclick="startGame()">
            Bắt đầu trò chơi
        </button>


        <button
            class="star-nav star-right1">
            Moving<br>5 star
        </button>


        <button
            class="star-nav star-right2">
            Moving<br>6 star
        </button>


        <button
            class="star-nav star-right3">
            Moving<br>7 star
        </button>


        <button
            class="star-nav star-right4">
            Moving<br>8 star
        </button>


    </div>


</div>


<script>

/* =====================================================
   MENU NHÂN VẬT
===================================================== */

function toggleCharacterMenu(event){

    event.stopPropagation();

    const menu =
        document.getElementById(
            "characterMenu"
        );

    const card =
        document.getElementById(
            "characterCard"
        );


    const rect =
        card.getBoundingClientRect();


    /* đặt menu bên phải card */

    menu.style.left =
        (rect.right + 10) + "px";


    menu.style.top =
        (rect.top + 5) + "px";


    menu.classList.toggle("show");

}


/* =====================================================
   CLICK NGOÀI
===================================================== */

document.addEventListener(
    "click",
    function(){

        document
            .getElementById(
                "characterMenu"
            )
            .classList
            .remove("show");

    }
);


/* =====================================================
   MENU ACTION
===================================================== */

function menuAction(
    event,
    action
){

    event.stopPropagation();

    alert(
        "Bạn chọn: " +
        action
    );

}


/* =====================================================
   ĐÓNG MENU
===================================================== */

function closeCharacterMenu(
    event
){

    event.stopPropagation();

    document
        .getElementById(
            "characterMenu"
        )
        .classList
        .remove("show");

}


/* =====================================================
   QUAY LẠI
===================================================== */

function goBack(){

    window.location.href =
        "giaodien.html";

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    alert(
        "Draw đang được phát triển."
    );

}


/* =====================================================
   BẮT ĐẦU TRÒ CHƠI
===================================================== */

function startGame(){

    alert(
        "Bắt đầu trò chơi!"
    );

}

</script>

</body>
</html>
