<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lập Nhóm - El Dorado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    
    #bg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Giao diện nút Trở về */
    .btn-back {
      position: absolute;
      top: 5%;
      left: 5%;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffd700;
      border: 2px solid #c8860a;
      border-radius: 8px;
      text-decoration: none;
      font-family: sans-serif;
      font-weight: bold;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }
    
    .btn-back:active {
      background: rgba(255, 210, 0, 0.25);
      box-shadow: 0 0 0 2px rgba(255, 210, 0, 0.5);
    }
  </style>
</head>
<body>

<div id="screen">
  <!-- Dùng thẳng tên file ảnh bạn đã tải lên, không cần mã dài dòng -->
  <img id="bg" src="nennhom.jpg">

  <!-- Nút bấm quay lại trang chính index.html -->
  <a href="index.html" class="btn-back">🔙 Trở Về</a>
</div>

</body>
</html>
