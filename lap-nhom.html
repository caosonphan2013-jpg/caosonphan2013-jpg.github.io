<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lập nhóm</title>
  <link rel="stylesheet" href="lap-nhom.css">
</head>
<body>
<div id="screen">
  <img id="bg" src="nennhom.jpg" alt="">
  <div id="overlay">

    <!-- Nút back -->
    <button class="hit" id="btn-back"    onclick="goBack()"></button>

    <!-- 5 slot nhân vật -->
    <button class="hit" id="slot-0"      onclick="clickSlot(0)"></button>
    <button class="hit" id="slot-1"      onclick="clickSlot(1)"></button>
    <button class="hit" id="slot-2"      onclick="clickSlot(2)"></button>
    <button class="hit" id="slot-3"      onclick="clickSlot(3)"></button>
    <button class="hit" id="slot-4"      onclick="clickSlot(4)"></button>

    <!-- Card nhân vật Ace -->
    <button class="hit" id="btn-card"    onclick="toggleMenu()"></button>

    <!-- Draw + Bắt đầu -->
    <button class="hit" id="btn-draw"    onclick="showToast('Draw!')"></button>
    <button class="hit" id="btn-start"   onclick="showToast('Bắt đầu trò chơi!')"></button>

    <!-- Moving circles trái -->
    <button class="hit" id="mc-0" onclick="showToast('Moving 1 star')"></button>
    <button class="hit" id="mc-1" onclick="showToast('Moving 2 star')"></button>
    <button class="hit" id="mc-2" onclick="showToast('Moving 3 star')"></button>
    <button class="hit" id="mc-3" onclick="showToast('Moving 4 star')"></button>

    <!-- Moving circles phải -->
    <button class="hit" id="mc-4" onclick="showToast('Moving 5 star')"></button>
    <button class="hit" id="mc-5" onclick="showToast('Moving 6 star')"></button>
    <button class="hit" id="mc-6" onclick="showToast('Moving 7 star')"></button>
    <button class="hit" id="mc-7" onclick="showToast('Moving 8 star')"></button>

    <!-- Context menu khi bấm card -->
    <div id="ctx-menu" class="hidden">
      <button class="ctx-item highlight" onclick="ctxAction('Rút')">Rút</button>
      <button class="ctx-item"           onclick="ctxAction('Bán')">Bán</button>
      <button class="ctx-item"           onclick="ctxAction('Nâng cấp độ')">Nâng cấp độ</button>
      <button class="ctx-item"           onclick="ctxAction('Item')">Item</button>
      <button class="ctx-item"           onclick="ctxAction('Lock')">Lock</button>
      <button class="ctx-item"           onclick="closeMenu()">Đóng</button>
    </div>

  </div>
</div>

<div id="toast" class="hidden"></div>
<script src="lap-nhom.js"></script>
</body>
</html>
