<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>EL DORADO - Lập Nhóm</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

/* =====================================================
   MÀN HÌNH
===================================================== */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}


/* =====================================================
   KHUNG GAME 16:9
===================================================== */

#scene{
    position:absolute;

    width:1536px;
    height:864px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

    overflow:hidden;
}


/* =====================================================
   NỀN NẰM DƯỚI TOÀN BỘ GIAO DIỆN
===================================================== */

#background{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;

    user-select:none;
    -webkit-user-drag:none;
}


/* lớp phủ rất nhẹ để UI nổi hơn */

#shade{
    position:absolute;
    inset:0;

    z-index:1;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.10),
            rgba(0,0,0,.05) 55%,
            rgba(0,0,0,.18)
        );
}


/* =====================================================
   TẤT CẢ GIAO DIỆN ĐÈ LÊN ẢNH
===================================================== */

.ui{
    position:absolute;
    inset:0;
    z-index:10;
}


/* =====================================================
   THANH TRÊN
===================================================== */

.back{
    position:absolute;

    left:22px;
    top:20px;

    width:62px;
    height:62px;

    border-radius:16px;

    border:2px solid rgba(255,255,255,.9);

    background:rgba(0,0,0,.35);

    color:white;

    font-size:37px;

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}

.page-title{
    position:absolute;

    left:96px;
    top:25px;

    color:white;

    font-size:42px;
    font-weight:500;

    text-shadow:
        0 3px 6px rgba(0,0,0,.7);
}


/* =====================================================
   TÀI NGUYÊN
===================================================== */

.resources{
    position:absolute;

    right:25px;
    top:17px;

    display:flex;
    gap:10px;
}

.resource{
    min-width:142px;
    height:43px;

    padding:0 13px;

    display:flex;
    align-items:center;

    border-radius:24px;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid
        rgba(255,255,255,.32);

    color:white;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.20);
}

.resource-icon{
    width:30px;
    font-size:21px;
}

.resource-value{
    flex:1;
    text-align:center;
    font-size:17px;
    font-weight:600;
}


/* =====================================================
   SỐ NHÂN VẬT
===================================================== */

.character-count{
    position:absolute;

    right:30px;
    top:71px;

    color:#fff;

    font-size:16px;

    text-shadow:
        0 2px 5px #000;
}


/* =====================================================
   CÁC SLOT NHÂN VẬT
===================================================== */

.character-slots{
    position:absolute;

    left:50%;
    top:145px;

    transform:
        translateX(-50%);

    display:flex;

    gap:15px;
}


/* slot */

.slot{
    position:relative;

    width:174px;
    height:120px;

    overflow:hidden;

    border-radius:13px;

    background:
        rgba(30,80,105,.60);

    border:
        2px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 6px 18px rgba(0,0,0,.20),
        inset 0 0 25px
        rgba(255,255,255,.06);
}


/* slot đang chọn */

.slot.selected{
    background:
        linear-gradient(
            145deg,
            rgba(205,130,30,.94),
            rgba(116,66,17,.88)
        );

    border:
        3px solid
        #ffd768;

    box-shadow:
        0 0 20px
        rgba(255,215,105,.45);
}


/* dấu + */

.plus{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    color:#ffd66e;

    font-size:62px;

    font-weight:200;

    text-shadow:
        0 2px 5px rgba(0,0,0,.4);
}


/* ảnh nhân vật nhỏ */

.slot-character{
    position:absolute;

    inset:5px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.slot-character img{
    width:100%;
    height:100%;

    object-fit:contain;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.38)
        );
}


/* giá */

.slot-cost{
    position:absolute;

    bottom:3px;
    left:0;
    right:0;

    text-align:center;

    color:white;

    font-size:16px;

    text-shadow:
        0 2px 4px #000;
}


/* =====================================================
   BẢNG NHÂN VẬT ĐÈ LÊN NỀN
===================================================== */

.character-card{
    position:absolute;

    left:50%;
    top:300px;

    transform:
        translateX(-50%);

    width:285px;
    height:390px;

    padding:8px;

    border-radius:12px;

    background:
        linear-gradient(
            180deg,
            #ffe493,
            #a96b25
        );

    border:
        4px solid
        #f1ca61;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    cursor:pointer;
}


/* phần trong */

.card-inner{
    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:6px;

    background:
        linear-gradient(
            180deg,
            rgba(255,240,185,.96),
            rgba(220,170,88,.96)
        );

    padding:
        38px
        12px
        10px;

    color:#5d3712;
}


/* ACT */

.act{
    position:absolute;

    left:-8px;
    top:-4px;

    width:70px;
    height:52px;

    background:#d85b18;

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:17px;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 80%,
            50% 100%,
            0 80%
        );
}


/* STAR */

.card-star{
    position:absolute;

    left:50%;
    top:8px;

    transform:
        translateX(-50%);

    color:#ffe56a;

    font-size:25px;

    text-shadow:
        0 2px 3px #6d4700;
}


/* TÊN */

.card-name{
    text-align:center;

    font-size:24px;

    margin-bottom:2px;
}


/* NHÂN VẬT */

.main-character{
    display:block;

    width:175px;
    height:175px;

    margin:0 auto;

    object-fit:contain;

    filter:
        drop-shadow(
            0 7px 5px
            rgba(0,0,0,.25)
        );
}


/* INFO */

.info{
    margin-top:3px;
}

.info-row{
    min-height:31px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-top:
        1px solid
        rgba(80,45,10,.15);

    font-size:16px;
}


/* =====================================================
   MENU KHI CHẠM NHÂN VẬT
===================================================== */

#characterMenu{
    position:absolute;

    display:none;

    width:180px;

    overflow:hidden;

    border-radius:10px;

    border:
        3px solid
        #858585;

    background:#e9eef4;

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.45);
}

#characterMenu.show{
    display:block;
}

.menu-item{
    width:100%;

    min-height:53px;

    border:0;

    border-bottom:
        1px solid
        #c2cad2;

    background:#e6ebf0;

    color:#222;

    font-size:18px;

    cursor:pointer;
}

.menu-item:last-child{
    border-bottom:0;
}

.menu-item:active{
    background:#cbd6e0;
}

.menu-item.withdraw{
    background:#ffb200;
    color:white;
}


/* =====================================================
   DƯỚI CÙNG
===================================================== */

.bottom{
    position:absolute;

    left:20px;
    right:20px;
    bottom:14px;

    height:80px;

    display:flex;

    justify-content:center;
    align-items:center;
}


/* nút sao */

.star-button{
    position:absolute;

    width:96px;
    height:68px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.28);

    background:
        rgba(0,0,0,.18);

    color:white;

    font-size:13px;

    cursor:pointer;
}

.s1{left:0;}
.s2{left:112px;}
.s3{left:224px;}
.s4{left:336px;}

.s5{right:336px;}
.s6{right:224px;}
.s7{right:112px;}
.s8{right:0;}


/* DRAW */

.draw{
    width:180px;
    height:64px;

    margin-right:22px;

    border-radius:15px;

    border:
        3px solid
        #bb74ff;

    background:
        linear-gradient(
            180deg,
            #8c4dff,
            #6227c9
        );

    color:white;

    font-size:23px;
    font-weight:bold;

    cursor:pointer;
}


/* START */

.start{
    width:205px;
    height:64px;

    border-radius:15px;

    border:
        3px solid
        #dac27b;

    background:
        linear-gradient(
            180deg,
            #79c7f3,
            #3071c0
        );

    color:white;

    font-size:21px;

    font-weight:bold;

    line-height:22px;

    cursor:pointer;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,.5);
}


/* =====================================================
   SCALE
===================================================== */

@media(max-width:1536px){

    #scene{
        transform:
            translate(-50%,-50%)
            scale(
                min(
                    calc(100vw / 1536),
                    calc(100vh / 864)
                )
            );
    }

}


/* ngang điện thoại */

@media(
    orientation:landscape
){

    #scene{
        transform:
            translate(-50%,-50%)
            scale(
                min(
                    calc(100vw / 1536),
                    calc(100vh / 864)
                )
            );
    }

}


/* dọc điện thoại */

@media(
    orientation:portrait
){

    #scene{
        transform:
            translate(-50%,-50%)
            scale(
                min(
                    calc(100vw / 1536),
                    calc(100vh / 864)
                )
            );
    }

}

</style>
</head>

<body>

<div id="game">

    <!-- NỀN ẢNH -->
    <div id="scene">

        <img
            id="background"
            src="./nennhom.jpg"
            alt="Nền lập nhóm">

        <div id="shade"></div>

        <!-- =================================================
             TẤT CẢ UI ĐÈ TRÊN ẢNH
        ================================================== -->

        <div class="ui">

            <!-- HEADER -->

            <button
                class="back"
                onclick="goBack()">
                ‹
            </button>

            <div class="page-title">
                Lập nhóm
            </div>


            <!-- RESOURCES -->

            <div class="resources">

                <div class="resource">
                    <div class="resource-icon">🐣</div>
                    <div class="resource-value">0</div>
                </div>

                <div class="resource">
                    <div class="resource-icon">🟣</div>
                    <div class="resource-value">0</div>
                </div>

                <div class="resource">
                    <div class="resource-icon">🪙</div>
                    <div class="resource-value">700,000</div>
                </div>

                <div class="resource">
                    <div class="resource-icon">♦</div>
                    <div class="resource-value">665</div>
                </div>

                <div class="resource">
                    <div class="resource-icon">BP</div>
                    <div class="resource-value">0</div>
                </div>

            </div>


            <div class="character-count">
                My Characters : 1/30
            </div>


            <!-- CHARACTER SLOTS -->

            <div class="character-slots">

                <div class="slot selected">

                    <div class="slot-character">

                        <img
                            src="./hengame.png"
                            alt="Nhân vật">

                    </div>

                    <div class="slot-cost">
                        💧 30
                    </div>

                </div>


                <div class="slot">
                    <div class="plus">+</div>
                </div>


                <div class="slot">
                    <div class="plus">+</div>
                </div>


                <div class="slot">
                    <div class="plus">+</div>
                </div>


                <div class="slot">
                    <div class="plus">+</div>
                </div>

            </div>


            <!-- CHARACTER CARD -->

            <div
                id="characterCard"
                class="character-card"
                onclick="showCharacterMenu(event)">

                <div class="card-inner">

                    <div class="act">
                        Act.
                    </div>

                    <div class="card-star">
                        ★
                    </div>

                    <div class="card-name">
                        Ace
                    </div>

                    <img
                        class="main-character"
                        src="./hengame.png"
                        alt="Ace">

                    <div class="info">

                        <div class="info-row">
                            <span>Lv.1/20</span>
                            <span>0%</span>
                        </div>

                        <div class="info-row">
                            <span>💧 30</span>
                            <span>Kiểu tấn công</span>
                        </div>

                        <div class="info-row">
                            <span>AP</span>
                            <span>2</span>
                        </div>

                        <div class="info-row">
                            <span>HP</span>
                            <span>10</span>
                        </div>

                    </div>

                </div>

            </div>


            <!-- MENU -->

            <div
                id="characterMenu">

                <button
                    class="menu-item withdraw"
                    onclick="menuAction(event,'Rút')">
                    Rút
                </button>

                <button
                    class="menu-item"
                    onclick="menuAction(event,'Bán')">
                    Bán
                </button>

                <button
                    class="menu-item"
                    onclick="menuAction(event,'Nâng cấp độ')">
                    Nâng cấp độ
                </button>

                <button
                    class="menu-item"
                    onclick="menuAction(event,'Item')">
                    Item
                </button>

                <button
                    class="menu-item"
                    onclick="menuAction(event,'Lock')">
                    Lock
                </button>

            </div>


            <!-- BOTTOM -->

            <div class="bottom">

                <button class="star-button s1">
                    Moving<br>1 star
                </button>

                <button class="star-button s2">
                    Moving<br>2 star
                </button>

                <button class="star-button s3">
                    Moving<br>3 star
                </button>

                <button class="star-button s4">
                    Moving<br>4 star
                </button>

                <button
                    class="draw"
                    onclick="draw()">
                    🎴 Draw
                </button>

                <button
                    class="start"
                    onclick="startGame()">
                    Bắt đầu trò chơi
                </button>

                <button class="star-button s5">
                    Moving<br>5 star
                </button>

                <button class="star-button s6">
                    Moving<br>6 star
                </button>

                <button class="star-button s7">
                    Moving<br>7 star
                </button>

                <button class="star-button s8">
                    Moving<br>8 star
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   QUAY LẠI
===================================================== */

function goBack(){

    window.location.href =
        "./giaodien.html";

}


/* =====================================================
   CHẠM NHÂN VẬT
===================================================== */

function showCharacterMenu(event){

    event.stopPropagation();

    const card =
        document.getElementById(
            "characterCard"
        );

    const menu =
        document.getElementById(
            "characterMenu"
        );


    const rect =
        card.getBoundingClientRect();


    /*
       Vị trí theo tọa độ màn hình.
       Menu hiện ngay bên phải thẻ.
    */

    menu.style.left =
        (
            rect.right + 10
        ) + "px";

    menu.style.top =
        (
            rect.top + 35
        ) + "px";


    menu.classList.add(
        "show"
    );

}


/* =====================================================
   CHẠM RA NGOÀI
===================================================== */

document.addEventListener(
    "click",
    function(){

        document
            .getElementById(
                "characterMenu"
            )
            .classList
            .remove("show");

    }
);


/* =====================================================
   MENU
===================================================== */

function menuAction(
    event,
    action
){

    event.stopPropagation();

    alert(
        "Bạn chọn: " +
        action
    );

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    alert(
        "Draw đang được phát triển."
    );

}


/* =====================================================
   START
===================================================== */

function startGame(){

    alert(
        "Bắt đầu trò chơi!"
    );

}


/* =====================================================
   KIỂM TRA ẢNH
===================================================== */

document
    .getElementById("background")
    .addEventListener(
        "error",
        function(){

            document.body.innerHTML = `
                <div style="
                    color:white;
                    background:#111;
                    width:100vw;
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    text-align:center;
                    font-family:Arial;
                    padding:30px;">
                    <div>
                        <h2>
                            ❌ Không tải được nennhom.jpg
                        </h2>
                        <p>
                            Hãy kiểm tra file
                            <b>nennhom.jpg</b>
                            trong GitHub.
                        </p>
                    </div>
                </div>
            `;
        }
    );

</script>

</body>
</html>
