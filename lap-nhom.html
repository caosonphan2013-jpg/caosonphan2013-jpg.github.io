<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>EL DORADO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   GAME SCREEN
========================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================
   NỀN GAME
========================= */

#gameImage{
    position:absolute;
    left:50%;
    top:50%;

    width:100%;
    height:100%;

    transform:translate(-50%,-50%);

    object-fit:contain;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}

/* =========================
   LỚP NÚT
========================= */

#buttons{
    position:absolute;

    width:1536px;
    height:864px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

    pointer-events:none;
}

.hit{
    position:absolute;

    border:0;
    background:transparent;

    pointer-events:auto;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.hit:active{
    background:rgba(255,215,80,.16);

    box-shadow:
        inset 0 0 0 2px
        rgba(255,215,80,.45);
}

/* =========================
   PROFILE
========================= */

.profile{
    left:18px;
    top:18px;

    width:360px;
    height:92px;
}

/* =========================
   TÀI NGUYÊN
========================= */

.resource1{
    left:505px;
    top:12px;

    width:190px;
    height:62px;
}

.resource2{
    left:705px;
    top:12px;

    width:190px;
    height:62px;
}

.resource3{
    left:905px;
    top:12px;

    width:190px;
    height:62px;
}

.resource4{
    left:1105px;
    top:12px;

    width:175px;
    height:62px;
}

/* =========================
   ICON GÓC PHẢI
========================= */

.mail{
    right:170px;
    top:7px;

    width:63px;
    height:63px;
}

.menu{
    right:100px;
    top:7px;

    width:63px;
    height:63px;
}

.settings{
    right:30px;
    top:7px;

    width:63px;
    height:63px;
}

/* =========================
   EVENT
========================= */

.monthly{
    right:30px;
    top:105px;

    width:305px;
    height:140px;
}

.special{
    right:25px;
    top:270px;

    width:130px;
    height:165px;
}

/* =========================
   MENU DƯỚI
========================= */

.lapnhom{
    left:25px;
    bottom:8px;

    width:125px;
    height:120px;
}

.nangcap{
    left:165px;
    bottom:8px;

    width:125px;
    height:120px;
}

.draw{
    left:305px;
    bottom:8px;

    width:125px;
    height:120px;
}

.shop{
    left:445px;
    bottom:8px;

    width:125px;
    height:120px;
}

.thanhtich{
    left:585px;
    bottom:8px;

    width:135px;
    height:120px;
}

.banghoi{
    left:735px;
    bottom:8px;

    width:130px;
    height:120px;
}

/* =========================
   GAME START
========================= */

.game-start{
    right:0;
    bottom:0;

    width:385px;
    height:145px;

    border-radius:40px 0 0 0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    #gameImage{
        width:100vw;
        height:100vh;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- NỀN -->
    <img
        id="gameImage"
        src="nengame.png"
        alt="El Dorado">

    <!-- NÚT -->
    <div id="buttons">

        <!-- PROFILE -->
        <button
            class="hit profile"
            onclick="profile()">
        </button>

        <!-- RESOURCES -->
        <button
            class="hit resource1"
            onclick="resource(1)">
        </button>

        <button
            class="hit resource2"
            onclick="resource(2)">
        </button>

        <button
            class="hit resource3"
            onclick="resource(3)">
        </button>

        <button
            class="hit resource4"
            onclick="resource(4)">
        </button>

        <!-- TOP RIGHT -->
        <button
            class="hit mail"
            onclick="mail()">
        </button>

        <button
            class="hit menu"
            onclick="menu()">
        </button>

        <button
            class="hit settings"
            onclick="settings()">
        </button>

        <!-- EVENT -->
        <button
            class="hit monthly"
            onclick="monthly()">
        </button>

        <button
            class="hit special"
            onclick="special()">
        </button>

        <!-- BOTTOM -->
        <button
            class="hit lapnhom"
            onclick="openLapNhom()">
        </button>

        <button
            class="hit nangcap"
            onclick="nangCap()">
        </button>

        <button
            class="hit draw"
            onclick="draw()">
        </button>

        <button
            class="hit shop"
            onclick="shop()">
        </button>

        <button
            class="hit thanhtich"
            onclick="thanhTich()">
        </button>

        <button
            class="hit banghoi"
            onclick="bangHoi()">
        </button>

        <!-- GAME START -->
        <button
            class="hit game-start"
            onclick="gameStart()">
        </button>

    </div>
</div>

<script>

/* =====================================================
   LẬP NHÓM
===================================================== */

function openLapNhom(){

    window.location.href =
        "lap-nhom.html";

}


/* =====================================================
   PROFILE
===================================================== */

function profile(){

    alert(
        "Nhân vật\n\n" +
        "Tên: " +
        (localStorage.getItem(
            "eldoradoPlayerName"
        ) || "Người chơi")
    );

}


/* =====================================================
   RESOURCE
===================================================== */

function resource(number){

    if(number === 1){

        alert("Tài nguyên hiện tại: 0");

    }

    else if(number === 2){

        alert("Vàng: 700,000");

    }

    else if(number === 3){

        alert("Ruby: 665");

    }

    else if(number === 4){

        alert("B.P: 0");

    }

}


/* =====================================================
   TOP BUTTONS
===================================================== */

function mail(){

    alert(
        "Hộp thư\n\n" +
        "Chưa có thư mới."
    );

}


function menu(){

    alert(
        "Menu\n\n" +
        "Các tính năng khác sẽ được thêm sau."
    );

}


function settings(){

    alert(
        "Cài đặt\n\n" +
        "Âm thanh: Bật\n" +
        "Nhạc: Bật"
    );

}


/* =====================================================
   EVENT
===================================================== */

function monthly(){

    alert(
        "Monthly Character\n\n" +
        "Sự kiện nhân vật hàng tháng."
    );

}


function special(){

    alert(
        "Special Event\n\n" +
        "Sự kiện đặc biệt."
    );

}


/* =====================================================
   MENU DƯỚI
===================================================== */

function nangCap(){

    alert(
        "Nâng cấp\n\n" +
        "Chức năng sẽ được phát triển."
    );

}


function draw(){

    alert(
        "Draw\n\n" +
        "Chức năng quay nhân vật."
    );

}


function shop(){

    alert(
        "Shop\n\n" +
        "Cửa hàng đang được chuẩn bị."
    );

}


function thanhTich(){

    alert(
        "Thành tích\n\n" +
        "Bạn chưa có thành tích."
    );

}


function bangHoi(){

    alert(
        "Bang hội\n\n" +
        "Chức năng bang hội sẽ được thêm sau."
    );

}


/* =====================================================
   GAME START
===================================================== */

function gameStart(){

    alert(
        "GAME START\n\n" +
        "Bước tiếp theo sẽ là màn hình chọn nhân vật."
    );

}


/* =====================================================
   KIỂM TRA ẢNH
===================================================== */

document
    .getElementById("gameImage")
    .addEventListener(
        "error",
        function(){

            document.body.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#111;
                    color:white;
                    font-family:Arial;
                    text-align:center;
                    padding:30px;
                ">
                    <div>
                        <h2>❌ Không tải được nengame.png</h2>
                        <p>
                            Hãy kiểm tra file
                            <b>nengame.png</b>
                            có nằm cùng thư mục với
                            <b>giaodien.html</b> không.
                        </p>
                    </div>
                </div>
            `;

        }
    );


/* =====================================================
   RESPONSIVE SCALE
===================================================== */

function resizeGame(){

    const layer =
        document.getElementById(
            "buttons"
        );

    const screenW =
        window.innerWidth;

    const screenH =
        window.innerHeight;

    const designW = 1536;
    const designH = 864;

    const scale =
        Math.min(
            screenW / designW,
            screenH / designH
        );

    layer.style.transform =
        "translate(-50%,-50%) " +
        "scale(" +
        scale +
        ")";

}


window.addEventListener(
    "resize",
    resizeGame
);

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeGame,
            300
        );

    }
);


resizeGame();

</script>

</body>
</html>
