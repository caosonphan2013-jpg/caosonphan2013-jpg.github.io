<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Lập nhóm - EL DORADO</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================
   KHUNG CHÍNH
========================================= */

#game{

    position:fixed;

    inset:0;

    overflow:hidden;

    background:#000;

}


/* =========================================
   THIẾT KẾ CỐ ĐỊNH
========================================= */

#scene{

    position:absolute;

    width:1536px;
    height:864px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

    overflow:hidden;
}


/* =========================================
   NỀN
========================================= */

#background{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================================
   LỚP TỐI
========================================= */

.dark{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.06),
            rgba(0,0,0,.18)
        );

    pointer-events:none;

}


/* =========================================
   HEADER
========================================= */

.header{

    position:absolute;

    left:20px;
    right:20px;
    top:18px;

    height:72px;

    display:flex;

    align-items:center;

    z-index:20;

}


/* BACK */

.back{

    width:58px;
    height:58px;

    border-radius:15px;

    border:
        2px solid
        rgba(255,255,255,.8);

    background:
        rgba(0,0,0,.35);

    color:white;

    font-size:35px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}


/* TITLE */

.title{

    margin-left:12px;

    color:white;

    font-size:42px;

    font-weight:400;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.65);

}


/* =========================================
   RESOURCES
========================================= */

.resources{

    position:absolute;

    right:25px;
    top:15px;

    display:flex;

    gap:10px;

}


.resource{

    height:42px;

    min-width:150px;

    padding:0 13px;

    display:flex;

    align-items:center;

    border-radius:22px;

    background:
        rgba(0,0,0,.62);

    border:
        1px solid
        rgba(255,255,255,.28);

    color:white;

}


.resource-icon{

    font-size:22px;

    margin-right:6px;

}


.resource-value{

    flex:1;

    text-align:center;

    font-size:18px;

}


/* character count */

.count{

    position:absolute;

    top:89px;

    right:30px;

    color:white;

    font-size:17px;

    text-shadow:
        0 2px 4px black;

}


/* =========================================
   CHARACTER SLOTS
========================================= */

.slots{

    position:absolute;

    left:50%;

    top:180px;

    transform:
        translateX(-50%);

    width:1000px;

    height:145px;

    display:flex;

    gap:18px;

}


/* SLOT */

.slot{

    width:180px;

    height:120px;

    position:relative;

    overflow:hidden;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            rgba(31,89,119,.86),
            rgba(38,72,95,.86)
        );

    border:
        2px solid
        rgba(255,255,255,.12);

}


/* SLOT ACTIVE */

.slot.active{

    background:
        linear-gradient(
            145deg,
            #c27b21,
            #815017
        );

    border:
        3px solid
        #ffd76d;

    box-shadow:
        0 0 18px
        rgba(255,214,100,.45);

}


/* PLUS */

.plus{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    color:#ffd76b;

    font-size:62px;

    font-weight:200;

}


/* SLOT IMAGE */

.slot-image{

    position:absolute;

    inset:6px;

    display:flex;

    align-items:center;

    justify-content:center;

}


.slot-image img{

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.4)
        );

}


/* COST */

.cost{

    position:absolute;

    left:0;
    right:0;
    bottom:3px;

    text-align:center;

    color:white;

    font-size:17px;

    text-shadow:
        0 2px 4px black;

}


/* =========================================
   CHARACTER CARD
========================================= */

.card{

    position:absolute;

    left:50%;

    top:345px;

    transform:
        translateX(-50%);

    width:265px;

    height:350px;

    padding:7px;

    border-radius:12px;

    background:
        linear-gradient(
            180deg,
            #ffe18d,
            #aa6e28
        );

    border:
        4px solid
        #f2c85e;

    box-shadow:
        0 14px 35px
        rgba(0,0,0,.42);

    z-index:15;

    cursor:pointer;

}


/* CARD INNER */

.card-inner{

    position:relative;

    width:100%;
    height:100%;

    border-radius:6px;

    overflow:hidden;

    padding:
        35px 12px 10px;

    background:
        linear-gradient(
            180deg,
            #f5dda8,
            #dbaa61
        );

    color:#593816;

}


/* ACT */

.act{

    position:absolute;

    left:-8px;
    top:-3px;

    width:68px;
    height:50px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#d85a17;

    color:white;

    font-size:17px;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 80%,
            50% 100%,
            0 80%
        );

}


/* STAR */

.star{

    position:absolute;

    top:8px;

    left:50%;

    transform:
        translateX(-50%);

    color:#ffe46c;

    font-size:24px;

    text-shadow:
        0 2px 2px #6d4700;

}


/* NAME */

.name{

    text-align:center;

    font-size:23px;

    margin-bottom:2px;

}


/* CHARACTER */

.character{

    width:155px;

    height:155px;

    display:block;

    margin:0 auto;

    object-fit:contain;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(0,0,0,.24)
        );

}


/* INFO */

.info{

    margin-top:1px;

}


.info-row{

    height:29px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-top:
        1px solid
        rgba(80,45,10,.15);

    font-size:16px;

}


/* =========================================
   POPUP MENU
========================================= */

#characterMenu{

    position:fixed;

    width:170px;

    display:none;

    overflow:hidden;

    border-radius:10px;

    border:
        3px solid
        #858585;

    background:
        #e8eef4;

    z-index:100;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.48);

}


#characterMenu.show{

    display:block;

}


/* mũi tên */

#menuArrow{

    position:absolute;

    left:-15px;

    top:95px;

    width:0;
    height:0;

    border-top:
        12px solid transparent;

    border-bottom:
        12px solid transparent;

    border-right:
        15px solid #858585;

}


/* ITEM */

.menu-item{

    width:100%;

    min-height:52px;

    border:none;

    border-bottom:
        1px solid
        #c2cbd4;

    background:
        #e6ecf2;

    color:#222;

    font-size:18px;

    cursor:pointer;

}


.menu-item:last-child{

    border-bottom:none;

}


.menu-item:active{

    background:#cbd7e2;

}


.menu-item.withdraw{

    background:#ffb100;

    color:white;

}


/* =========================================
   BOTTOM
========================================= */

.bottom{

    position:absolute;

    left:20px;
    right:20px;

    bottom:13px;

    height:76px;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:20;

}


/* STAR BUTTON */

.star{

    position:absolute;

    bottom:0;

    width:100px;

    height:70px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.28);

    background:
        rgba(0,0,0,.20);

    color:white;

    font-size:14px;

    cursor:pointer;

}


.s1{left:0;}
.s2{left:115px;}
.s3{left:230px;}
.s4{left:345px;}

.s5{right:345px;}
.s6{right:230px;}
.s7{right:115px;}
.s8{right:0;}


/* DRAW */

.draw{

    width:175px;
    height:64px;

    margin-right:25px;

    border-radius:15px;

    border:
        3px solid
        #b36cff;

    background:
        linear-gradient(
            180deg,
            #8d4cff,
            #6124c2
        );

    color:white;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

}


/* START */

.start{

    width:190px;
    height:64px;

    border-radius:15px;

    border:
        3px solid
        #d4c07a;

    background:
        linear-gradient(
            180deg,
            #74c5f2,
            #2f6ec0
        );

    color:white;

    font-size:21px;

    line-height:22px;

    font-weight:bold;

    cursor:pointer;

    text-shadow:
        0 2px 3px rgba(0,0,0,.5);

}


/* =========================================
   MOBILE LANDSCAPE
========================================= */

@media(
    orientation:landscape
) and (
    max-height:600px
){

    #scene{

        transform:
            translate(-50%,-50%)
            scale(
                min(
                    calc(100vw / 1536),
                    calc(100vh / 864)
                )
            );

    }

}


/* =========================================
   PORTRAIT
========================================= */

@media(
    orientation:portrait
){

    #scene{

        transform:
            translate(-50%,-50%)
            scale(
                min(
                    calc(100vw / 1536),
                    calc(100vh / 864)
                )
            );

    }

}

</style>
</head>


<body>

<div id="game">

    <div id="scene">


        <!-- =====================================
             NỀN
        ====================================== -->

        <img
            id="background"
            src="./nennhom.jpg"
            alt="Lập nhóm">


        <div class="dark"></div>


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="header">

            <button
                class="back"
                onclick="goBack()">
                ‹
            </button>


            <div class="title">
                Lập nhóm
            </div>


            <div class="resources">

                <div class="resource">
                    <span class="resource-icon">🐣</span>
                    <span class="resource-value">0</span>
                </div>

                <div class="resource">
                    <span class="resource-icon">🟣</span>
                    <span class="resource-value">0</span>
                </div>

                <div class="resource">
                    <span class="resource-icon">🪙</span>
                    <span class="resource-value">700,000</span>
                </div>

                <div class="resource">
                    <span class="resource-icon">♦</span>
                    <span class="resource-value">665</span>
                </div>

                <div class="resource">
                    <span class="resource-icon">BP</span>
                    <span class="resource-value">0</span>
                </div>

            </div>


            <div class="count">
                My Characters : 1/30
            </div>

        </div>


        <!-- =====================================
             CHARACTER SLOTS
        ====================================== -->

        <div class="slots">


            <div class="slot active">

                <div class="slot-image">

                    <img
                        src="./hengame.png"
                        alt="Ace">

                </div>

                <div class="cost">
                    💧 30
                </div>

            </div>


            <div class="slot">
                <div class="plus">+</div>
            </div>


            <div class="slot">
                <div class="plus">+</div>
            </div>


            <div class="slot">
                <div class="plus">+</div>
            </div>


            <div class="slot">
                <div class="plus">+</div>
            </div>


        </div>


        <!-- =====================================
             CARD
        ====================================== -->

        <div
            id="card"
            class="card"
            onclick="showCharacterMenu(event)">


            <div class="card-inner">


                <div class="act">
                    Act.
                </div>


                <div class="star">
                    ★
                </div>


                <div class="name">
                    Ace
                </div>


                <img
                    class="character"
                    src="./hengame.png"
                    alt="Ace">


                <div class="info">

                    <div class="info-row">

                        <span>
                            Lv.1/20
                        </span>

                        <span>
                            0%
                        </span>

                    </div>


                    <div class="info-row">

                        <span>
                            💧 30
                        </span>

                        <span>
                            Kiểu tấn công
                        </span>

                    </div>


                    <div class="info-row">

                        <span>
                            AP
                        </span>

                        <span>
                            2
                        </span>

                    </div>


                    <div class="info-row">

                        <span>
                            HP
                        </span>

                        <span>
                            10
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================
             MENU NHÂN VẬT
        ====================================== -->

        <div
            id="characterMenu">

            <div id="menuArrow"></div>


            <button
                class="menu-item withdraw"
                onclick="action(event,'Rút')">
                Rút
            </button>


            <button
                class="menu-item"
                onclick="action(event,'Bán')">
                Bán
            </button>


            <button
                class="menu-item"
                onclick="action(event,'Nâng cấp độ')">
                Nâng cấp độ
            </button>


            <button
                class="menu-item"
                onclick="action(event,'Item')">
                Item
            </button>


            <button
                class="menu-item"
                onclick="action(event,'Lock')">
                Lock
            </button>


            <button
                class="menu-item"
                onclick="closeMenu(event)">
                Đóng
            </button>

        </div>


        <!-- =====================================
             BOTTOM
        ====================================== -->

        <div class="bottom">


            <button
                class="star s1">
                Moving<br>1 star
            </button>


            <button
                class="star s2">
                Moving<br>2 star
            </button>


            <button
                class="star s3">
                Moving<br>3 star
            </button>


            <button
                class="star s4">
                Moving<br>4 star
            </button>


            <button
                class="draw"
                onclick="draw()">
                🎴 Draw
            </button>


            <button
                class="start"
                onclick="startGame()">
                Bắt đầu trò chơi
            </button>


            <button
                class="star s5">
                Moving<br>5 star
            </button>


            <button
                class="star s6">
                Moving<br>6 star
            </button>


            <button
                class="star s7">
                Moving<br>7 star
            </button>


            <button
                class="star s8">
                Moving<br>8 star
            </button>

        </div>


    </div>

</div>


<script>

/* =========================================
   VỀ GIAO DIỆN CHÍNH
========================================= */

function goBack(){

    window.location.assign(
        "./giaodien.html"
    );

}


/* =========================================
   HIỆN MENU NHÂN VẬT
========================================= */

function showCharacterMenu(event){

    event.stopPropagation();


    const card =
        document.getElementById(
            "card"
        );

    const menu =
        document.getElementById(
            "characterMenu"
        );


    const cardRect =
        card.getBoundingClientRect();


    /*
       Menu mở ở bên phải
       thẻ nhân vật.
    */

    menu.style.left =
        (
            cardRect.right + 12
        ) + "px";


    menu.style.top =
        (
            cardRect.top + 25
        ) + "px";


    menu.classList.add(
        "show"
    );

}


/* =========================================
   CLICK RA NGOÀI
========================================= */

document.addEventListener(
    "click",
    function(){

        closeMenu();

    }
);


/* =========================================
   MENU ACTION
========================================= */

function action(
    event,
    name
){

    event.stopPropagation();


    if(name === "Rút"){

        alert(
            "Đã chọn: Rút"
        );

    }

    else if(name === "Bán"){

        alert(
            "Đã chọn: Bán"
        );

    }

    else if(
        name === "Nâng cấp độ"
    ){

        alert(
            "Nâng cấp độ"
        );

    }

    else if(name === "Item"){

        alert(
            "Item"
        );

    }

    else if(name === "Lock"){

        alert(
            "Lock"
        );

    }

}


/* =========================================
   ĐÓNG MENU
========================================= */

function closeMenu(
    event
){

    if(event){
        event.stopPropagation();
    }

    document
        .getElementById(
            "characterMenu"
        )
        .classList
        .remove("show");

}


/* =========================================
   DRAW
========================================= */

function draw(){

    alert(
        "Draw đang được phát triển."
    );

}


/* =========================================
   GAME START
========================================= */

function startGame(){

    alert(
        "Bắt đầu trò chơi."
    );

}

</script>

</body>
</html>
